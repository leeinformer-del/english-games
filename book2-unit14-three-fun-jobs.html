<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Three Fun Jobs</title>
<style>
:root{--ink:#2b2a3a;--a:#1b5e7b;--b:#e76f51;--sun:#ffd84a;--bg1:#e8f3fa;--bg2:#b8d6e8;--red:#ff5c5c;--ok:#2fb86a;box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Baloo 2","Comic Sans MS","Chalkboard SE",system-ui,sans-serif;background:linear-gradient(var(--bg1),var(--bg2));color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:8px;padding:6px 14px;flex-wrap:wrap}
.tab{padding:5px 14px;border-radius:99px;background:#fff9;font-weight:700;font-size:15px;cursor:pointer}
.tab.on{background:var(--a);color:#fff}
#h{flex:1;font-size:clamp(17px,2.6vw,26px);font-weight:800;min-width:150px}
#t{font-size:28px;font-weight:800;background:#fff;border-radius:14px;padding:0 12px;min-width:86px;text-align:center}
#t.low{background:var(--red);color:#fff}
button{font:inherit;font-weight:800;border:0;border-radius:14px;padding:8px 16px;background:var(--sun);color:var(--ink);cursor:pointer}
button.sm{background:#fff;padding:6px 12px;font-size:15px;opacity:.85}
button.go{background:var(--a);color:#fff;font-size:20px;padding:10px 24px}
button:disabled{opacity:.4;cursor:default}
main{flex:1;min-height:0;display:flex;gap:14px;align-items:center;justify-content:center;padding:4px 14px 8px}
.panel{background:#fff;border-radius:22px;padding:12px 16px;box-shadow:0 6px 0 #0002;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.say{font-size:clamp(18px,2.8vh,26px);font-weight:800;min-height:30px}
.ans{color:#c0392b}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.row button{background:#ffe9a8;font-size:15px}
.pl{background:repeating-linear-gradient(45deg,#e9e4f5,#e9e4f5 10px,#f4f1fb 10px,#f4f1fb 20px);border:3px dashed #b9b0d8;border-radius:16px;display:grid;place-items:center;color:#7a6fa8;font-weight:800;text-align:center;padding:4px;aspect-ratio:1;min-width:0}
.pl span{font-size:clamp(11px,2vh,18px);line-height:1.1}
img.ph,.pl{width:100%;aspect-ratio:1}
img.ph{object-fit:cover;border-radius:16px;display:block}
#tip{padding:6px 16px;background:#fff9;font-size:14px;max-height:36vh;overflow:auto;display:none}
#tip ol{margin:4px 0 6px;padding-left:22px}#tip li{margin:2px 0}
#ro{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9}
#ro>div{background:#fff;border-radius:24px;padding:26px 36px;text-align:center;font-size:clamp(24px,5vw,40px);font-weight:800;max-width:90vw}
#ro small{display:block;font-size:18px;font-weight:700;margin:8px 0 14px;color:#666}
.star{display:inline-block;width:1em;height:1em;background:var(--sun);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);vertical-align:-.1em}
.qb{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(560px,100%)}
.qc{position:relative;aspect-ratio:1.25;border-radius:16px;border:5px solid var(--a);background:var(--bg2);color:var(--a);font-size:clamp(34px,7vh,60px);font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;padding:6px}
.qc u{position:absolute;top:3px;left:8px;font-size:13px;text-decoration:none;background:#fffc;border-radius:6px;padding:0 5px;color:var(--ink)}
.qc.dn{background:#e8f5e9;border-color:#9bd3ae;color:var(--ink);opacity:.65;font-size:clamp(13px,2.2vh,20px);line-height:1.2}
.qc.dn.on{background:#fff2a8;border-color:var(--red);opacity:1}
.qbig{font-size:clamp(26px,5vh,42px);font-weight:800;line-height:1.2}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:none}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pop .45s}
.row button.go{background:var(--a);color:#fff}.shake{animation:shake .35s}
#t,#tb{display:none!important}
.lg{display:grid;grid-template-columns:repeat(var(--c,4),min(var(--s,17vh),130px));gap:8px;justify-content:center}
.lt{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#fff;border:4px solid #fff;box-shadow:0 2px 0 #0002;cursor:pointer}
.lt .ph,.lt .pl{width:100%;height:100%;border-radius:0}
.lt .lbd{position:absolute;left:0;right:0;bottom:0;background:var(--a);color:#fff;font-weight:800;text-align:center;font-size:clamp(12px,2.1vh,17px);padding:3px 0;display:none}
.lt.sw .lbd{display:block}
.ok7{background:#2eae60!important;color:#fff!important}
.wr8{background:#e05a4f!important;color:#fff!important}
.av{width:clamp(70px,13vh,100px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:clamp(30px,6vh,50px)}
.nmt{font-size:clamp(20px,3.6vh,30px);font-weight:800}
.tg{position:absolute;left:0;right:0;bottom:0;z-index:5;color:#fff;font-weight:800;font-size:clamp(11px,2vh,16px);text-align:center;padding:2px;background:var(--a)}
.fill{position:relative;overflow:hidden}
.fill .ph,.fill .pl{position:absolute;inset:0;width:100%;height:100%;border-radius:0}
.lt{overflow:visible}.lt .ph,.lt .pl{border-radius:8px}
.qm3{position:absolute;right:-7px;top:-7px;width:26px;height:26px;border-radius:50%;background:var(--b);color:#fff;font-size:16px;line-height:26px;text-align:center;font-weight:800;z-index:6;box-shadow:0 2px 0 #0003;animation:qm3p 1s infinite alternate;pointer-events:none}
.lt.sw .qm3{background:#2e9e5b;animation:none}
@keyframes qm3p{to{transform:scale(1.25)}}
.lt .lbd{border-radius:0 0 8px 8px}
.j3{display:flex;gap:12px;justify-content:center}
.jt{position:relative;width:min(16vh,120px);aspect-ratio:1;border-radius:14px;overflow:hidden;border:4px solid #fff;box-shadow:0 2px 0 #0002;background:#fff}
.jt .ph,.jt .pl{position:absolute;inset:0;width:100%;height:100%;border-radius:0}
.jt.big{width:min(25vh,180px)}
.jt.ch{cursor:pointer}
.jt .lbd{position:absolute;left:0;right:0;bottom:0;background:var(--a);color:#fff;font-weight:800;text-align:center;font-size:clamp(12px,2.1vh,17px);padding:3px 0;display:none}
.jt.sw .lbd{display:block}
.jt.gd{border-color:#2eae60}.jt.bd{border-color:#e05a4f;opacity:.55}
.slotm{display:flex;gap:14px;justify-content:center;align-items:center}
.reel{position:relative;width:min(19vh,138px);aspect-ratio:1;border-radius:16px;overflow:hidden;border:5px solid var(--a);background:#fff;box-shadow:inset 0 0 0 3px #fff}
.reel .ph,.reel .pl{position:absolute;inset:0;width:100%;height:100%;border-radius:0}
.reel .rt{position:absolute;left:0;right:0;bottom:0;background:var(--a);color:#fff;font-weight:800;text-align:center;font-size:clamp(12px,2.1vh,17px);padding:3px 0}
.reel.spin{filter:blur(1.5px)}
.rav{width:100%;height:100%;display:grid;place-items:center;font-size:clamp(30px,6vh,48px);font-weight:800;color:#fff}
.dr{display:grid;grid-template-columns:repeat(3,min(17vh,126px));gap:12px;justify-content:center}
.door{position:relative;aspect-ratio:.82;perspective:500px;cursor:pointer}
.door .dd{position:absolute;inset:0;background:linear-gradient(#b5835a,#8a5d36);border:4px solid #6b4423;border-radius:10px 10px 4px 4px;color:#fff;font-size:clamp(28px,6vh,46px);font-weight:800;display:grid;place-items:center;transform-origin:left center;transition:transform .6s;z-index:2}
.door .dd:after{content:"";position:absolute;right:10px;top:50%;width:10px;height:10px;border-radius:50%;background:#ffd84a}
.door.op .dd{transform:scaleX(.05);opacity:.9}
.door .in2{position:absolute;inset:0;border-radius:6px;overflow:hidden;background:#fff;border:4px solid #fff}
.door .in2 .ph,.door .in2 .pl{position:absolute;inset:0;width:100%;height:100%;border-radius:0}
.door .in2 .tg{display:none}.door.op .in2 .tg{display:block}
.door.dn{opacity:.55}
.m14{display:flex;gap:26px;align-items:center;justify-content:center}
.m14r{display:flex;flex-direction:column;gap:8px;align-items:center;max-width:400px}
.chw{display:flex;flex-direction:column;align-items:center;gap:4px}
.cl14{min-height:30px;font-weight:800;font-size:clamp(16px,2.8vh,24px);color:var(--a)}
.jt.ch.sl{border-color:var(--b);box-shadow:0 0 0 4px #e76f5155}
.jt.bd{opacity:.55}
.pzw{display:flex;flex-direction:column;align-items:center;gap:4px}
.pz14{position:relative;width:min(34vh,250px);aspect-ratio:1;border-radius:14px;overflow:hidden;border:4px solid #fff;box-shadow:0 2px 0 #0002;background:#fff}
.pz14 .ph,.pz14 .pl{position:absolute;inset:0;width:100%;height:100%;border-radius:0}
.tg14{position:absolute;inset:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:2px}
.tl14{background:linear-gradient(135deg,#1b5e7b,#2b86ad);display:grid;place-items:center;cursor:pointer;color:#ffffffaa;font-size:clamp(20px,4vh,32px);font-weight:800;transition:opacity .35s,transform .35s}
.tl14.op{opacity:0;transform:scale(.6);pointer-events:none}
.cl14.big{min-height:36px;font-size:clamp(22px,4vh,32px)}
.tl14.lk{filter:grayscale(1) brightness(.8);cursor:not-allowed}
.wg14{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.lt14{min-width:44px;height:50px;border-radius:10px;border:2px solid #1b5e7b;background:#fff;font-weight:800;font-size:28px;line-height:46px;font-family:inherit;color:#1b5e7b;padding:0 4px;text-align:center;display:inline-block}
.lt14.sl{background:#eef5f8;border-style:dashed}.lt14.sl.f{background:#1b5e7b;color:#fff;border-style:solid}
.pool .lt14{cursor:pointer;background:#ffe08a;color:#222;border-color:#e0a800}.pool .lt14.u{opacity:.25;pointer-events:none}
.cr14{width:clamp(130px,26vh,190px);background:#e76f51;border-radius:14px 14px 6px 6px;padding:7px;cursor:pointer;box-shadow:0 3px 0 #0003}
.cp14{height:clamp(100px,19vh,140px);border-radius:8px;overflow:hidden;position:relative;background:#fff}
.cp14 .ph,.cp14 .pl{position:absolute;inset:0;width:100%;height:100%;border-radius:0}
.cs14{height:40px;margin-top:6px;border-radius:8px;background:#fff6;border:2px dashed #fff;color:#fff;font:800 20px/36px sans-serif;text-align:center}
.cs14.f{background:#fff;color:#222;border:2px solid #fff}.cs14.ok{background:#2f9e5b;color:#fff;border-color:#2f9e5b}
.cn14{width:14px;height:8px;background:#444;margin-bottom:20px}
.wc14{min-width:90px;height:46px;border-radius:12px;border:2px solid #e0a800;background:#ffe08a;font:800 20px sans-serif;color:#222;padding:0 14px;cursor:pointer}
.wc14.u{opacity:.25;pointer-events:none}.wc14.sel{background:#fff;outline:3px solid #1b5e7b;transform:translateY(-3px)}
.trw14{position:relative;align-self:stretch;padding:4px 0 0;margin:2px 0 4px}
html,body{overflow-x:hidden}
.tr14{display:flex;align-items:flex-end;justify-content:center;transform:translateX(0);position:relative;padding-bottom:12px}
.tr14.go{animation:depart14 3.2s cubic-bezier(.55,0,.85,.5) forwards}
@keyframes depart14{0%{transform:translateX(0)}12%{transform:translateX(-14px)}100%{transform:translateX(125vw)}}
.rail14{height:7px;background:repeating-linear-gradient(90deg,#6b4a2b 0 14px,transparent 14px 26px) bottom/100% 4px no-repeat,linear-gradient(#777,#777) top/100% 3px no-repeat;margin-top:-4px;position:relative;height:8px}
.cr14{position:relative}
.cr14::before,.cr14::after,.wh{content:"";position:absolute;bottom:-12px;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle,#999 0 3px,#333 4px 6px,#bbb 7px);border:3px solid #333;box-sizing:border-box}
.cr14::before{left:20px}.cr14::after{right:20px}
.tr14.go .cr14::before,.tr14.go .cr14::after,.tr14.go .wh{animation:spin14 .35s linear infinite}
@keyframes spin14{to{transform:rotate(360deg)}}
.tr14.go .cr14,.tr14.go .eng14{animation:rock14 .22s ease-in-out infinite}
@keyframes rock14{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.eng14{position:relative;width:clamp(120px,20vh,160px);height:clamp(100px,19vh,140px);margin-bottom:0;flex:none}
.eng14 i{position:absolute;display:block}
.eng14 .bl{left:0;bottom:12px;width:70%;height:62%;background:#2b3a4a;border-radius:10px 38px 8px 8px;box-shadow:inset 0 -8px 0 #1a2430}
.eng14 .cab{right:0;bottom:12px;width:36%;height:85%;background:#c0392b;border-radius:10px 10px 4px 4px}
.eng14 .cab::after{content:"";position:absolute;left:18%;top:16%;width:64%;height:34%;background:#bfe6ff;border-radius:4px;border:3px solid #fff}
.eng14 .chm{left:14%;bottom:calc(12px + 62%);width:20%;height:26%;background:#111;border-radius:4px 4px 10px 10px}
.eng14 .wh{bottom:0;width:26px;height:26px}.eng14 .w1{left:6%}.eng14 .w2{left:34%}.eng14 .w3{left:62%}
.eng14 .sm{left:18%;bottom:calc(12px + 88%);width:16px;height:16px;border-radius:50%;background:#fff;opacity:0}
.tr14.go .sm{animation:smoke14 1s ease-out infinite}.tr14.go .s2{animation-delay:.33s}.tr14.go .s3{animation-delay:.66s}
@keyframes smoke14{0%{opacity:.9;transform:translate(0,0) scale(.6)}100%{opacity:0;transform:translate(-40px,-50px) scale(2.2)}}

</style></head><body>

const LBL={"bank": "bank", "school": "school", "restaurant": "restaurant", "firestation": "fire station", "banker": "banker", "teacher": "teacher", "cook": "cook", "firefighter": "firefighter", "doctor": "doctor", "police": "police officer", "uncle": "uncle"};
function ph(k,c){return IMG[k]?'<img class="ph '+(c||'')+'" src="'+IMG[k]+'" alt="">':'<div class="pl '+(c||'')+'"><span>'+(LBL[k]||k)+'</span></div>'}
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const DUR=[180, 180, 360];
let cur=0,secs=0,iv=null;
function fmt(){$('#t').textContent=Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0');$('#t').classList.toggle('low',secs<=30)}
function tog(){if(iv){clearInterval(iv);iv=null;$('#tb').textContent='Start'}else{iv=setInterval(()=>{secs>0?(secs--,fmt()):tog()},1000);$('#tb').textContent='Pause'}}
function tgl(){const t=$('#tip');t.style.display=t.style.display=='block'?'none':'block'}
function say(h){$('#sy').innerHTML=h}
function fin(){celebrate('Three Fun Jobs!','They all have great jobs!')}
function celebrate(m,s){$('#rm').innerHTML=m;$('#rs').textContent=s||'';$('#ro').style.display='flex'}
function qcards(el,QS){
  const cells=QS.map(x=>({...x}));let last=-1;
  el.innerHTML='<div class="qb" id="qb"></div><div class="panel" id="qp" style="width:min(440px,100%);min-height:260px"><div class="qbig" id="qq">Tap a card!</div><div class="say" id="sy"></div><div class="row" id="qr"></div></div>';
  cells.forEach((c,i)=>{const d=document.createElement('div');d.className='qc';d.id='q'+i;d.innerHTML='<u>'+(i+1)+'</u>?';d.onclick=()=>{
    if(c.dn)return;c.dn=1;document.querySelectorAll('.qc').forEach(e=>e.classList.remove('on'));
    d.className='qc dn on pop';d.innerHTML='<u>'+(i+1)+'</u>'+c.q;
    $('#qq').textContent=c.q;say('');
    $('#qr').innerHTML='<button onclick="say(\'<span class=ans>'+c.h.replace(/'/g,"\\'")+'</span>\')">Hint</button><button onclick="say(\'<span class=ans>'+c.f.replace(/'/g,"\\'")+'</span>\')">Follow-up question</button>';
    if(cells.every(x=>x.dn))setTimeout(()=>celebrate('All cards open!','Great talking!'),700)};
    $('#qb').appendChild(d)});
}
const A=[];
function go(i){if(iv)tog();cur=i;secs=DUR[i];fmt();
  document.querySelectorAll('.tab').forEach((e,j)=>e.classList.toggle('on',j==i));
  $('#nx').style.display=i==A.length-1?'none':'';$('#fn').style.display=i==A.length-1?'':'none';
  $('#tt').innerHTML=A[i].tip;$('#h').textContent=A[i].h;$('#st').innerHTML='';A[i].run($('#st'))}

/* shared helpers */
function Llearn(el,items,start,title){const n=items.length;
 el.innerHTML='<div class="panel" style="width:auto"><div class="lg" style="--c:'+(n<=6?3:4)+'">'+items.map((x,i)=>'<div class="lt" id="lt'+i+'">'+ph(x[0])+'<div class="lbd">'+x[1]+'</div><b class="qm3">?</b></div>').join('')+'</div><div class="say" id="sy">'+(title||'Tap a picture. The word appears!')+'</div><div class="say" id="lc" style="font-size:15px;min-height:0">0 of '+n+' words</div><div class="row"><button class="go" onclick="'+start+'()">Start the game!</button></div></div>';
 items.forEach((x,i)=>{$('#lt'+i).onclick=()=>{const t=$('#lt'+i);t.classList.add('sw');const q=t.querySelector('.qm3');if(q)q.textContent='\u2713';t.style.animation='pop .4s';const k=document.querySelectorAll('.lt.sw').length;const c=$('#lc');if(c)c.textContent=k+' of '+n+' words'+(k>=n?' \u00b7 Great!':'');say('<span class="ans">'+x[1]+'</span>')}})}
const LB={sc:[],ph:0,hn:0,n:0,N:0,max:3,hint:null,reveal:null,render:null,fin:['','']};
function Lbtns(){return '<div class="row" id="lbr"><button onclick="Lhint()">Hint</button><button class="go" id="gob" onclick="Lgo()">Check answer</button><button class="ok7" id="okb" onclick="Lok()" style="display:none">Correct!</button><button class="wr8" id="wrb" onclick="Lwr()" style="display:none">Wrong</button></div><div class="say" id="sn" style="font-size:16px;min-height:0"></div>'}
function Lstart(N,render,hint,reveal,fin){LB.sc=[];LB.ph=0;LB.hn=0;LB.n=0;LB.N=N;LB.render=render;LB.hint=hint;LB.reveal=reveal;LB.fin=fin;render()}
function Lbar(){const s=LB.sc.reduce((a,b)=>a+b,0),e=$('#sn');if(e)e.innerHTML='Round '+(LB.n+1)+' of '+LB.N+' · <span class="star"></span> '+s+' / '+(LB.N*3)}
function Lnew(){LB.ph=0;LB.hn=0}
function Lhint(){if(LB.ph!=0)return;LB.hn=1;say('<span class="ans">'+LB.hint()+'</span>')}
function Lgo(){if(LB.ph==0){LB.ph=1;say('<span class="ans">'+LB.reveal()+'</span> Did the student say it?');$('#gob').style.display='none';$('#okb').style.display='';$('#wrb').style.display='';return}
 if(LB.ph==2){if(LB.n>=LB.N-1){const s=LB.sc.reduce((a,b)=>a+b,0);celebrate(LB.fin[0],LB.fin[1].replace('#',s+' of '+LB.N*3+' stars'));return}LB.n++;Lnew();LB.render()}}
function Lok(){Ljd(LB.hn?2:3)}function Lwr(){Ljd(0)}
function Ljd(p){if(LB.ph!=1)return;LB.sc.push(p);LB.ph=2;$('#okb').style.display='none';$('#wrb').style.display='none';const g=$('#gob');g.style.display='';g.textContent=LB.n>=LB.N-1?'Finish':'Next round';say(p?'<span class="ans" style="color:#1f8a4c">Great! +'+p+' stars</span>':'<span class="ans" style="color:#c0392b">Good try! Next time!</span>');Lbar()}

/* auto-fit: enlarge the main panel to use the laptop screen */
function Lfit(){const st=document.getElementById('st');if(!st)return;const p=st.firstElementChild;if(!p||!p.classList.contains('panel'))return;
 p.style.zoom=1;const aw=st.clientWidth-8,ah=st.clientHeight-8,r=p.getBoundingClientRect();let z=Math.min(1.6,aw/r.width,(ah-44)/r.height);if(z<1.06){return}
 for(let i=0;i<12;i++){p.style.zoom=z;const q=p.getBoundingClientRect();if(q.width<=aw&&q.height<=ah-40)break;z*=.95}if(z<1.04)p.style.zoom=1}
(function(){let t=0;const go=()=>{cancelAnimationFrame(t);t=requestAnimationFrame(()=>requestAnimationFrame(Lfit))};
 document.addEventListener('DOMContentLoaded',()=>{const st=document.getElementById('st');if(st)new MutationObserver(go).observe(st,{childList:true});window.addEventListener('resize',go);go()})})();
const J14=[['banker','banker','bank','He','a banker'],['teacher','teacher','school','She','a teacher'],['cook','cook','restaurant','He','a cook']];
const L14=[['bank','bank'],['banker','banker'],['restaurant','restaurant'],['cook','cook'],['school','school'],['teacher','teacher'],['uncle','uncle']];
A.push({h:'1. Word Train',tip:'<ol><li>FIRST (Look &amp; Say): seven pictures. The student taps a picture, says the word, and the word appears.</li><li>Press "Start the game!" 5 TRAINS. Each train has 3 cars with a picture. Word cards wait below. The student taps a word card, then taps the car it belongs to. Tap a loaded car to take the card back. Hint loads one car for you.</li><li>Press "Check": wrong cards go back (right ones turn green and stay). When all 3 are right the train leaves. Optionally ask "Who is it? Where does he/she work?" for each car.</li></ol>',run:el=>{Llearn(el,L14,'m14s')}});
const T14={banker:'He is a banker. He works at a bank.',teacher:'She is a teacher. She works at a school.',cook:'He is a cook. He works at a restaurant.',school:'A teacher works at a school.',restaurant:'A cook works at a restaurant.',uncle:'My uncle works at a restaurant.'};
const TR14=[['banker','teacher','cook'],['school','restaurant','uncle'],['uncle','banker','school'],['cook','uncle','restaurant'],['teacher','school','banker']];
let i14=0,sc14=[],hn14=0,wr14=0,dn14=false,cr14=[],pl14=[],sel14=-1;
function m14s(){i14=0;sc14=[];m141()}
function m141(){const ws=TR14[i14];hn14=0;wr14=0;dn14=false;sel14=-1;cr14=[null,null,null];pl14=shuf(ws.map((w,k)=>({w:w,k:k,u:0,l:0})));
 if(pl14.every((x,k)=>x.k==k))pl14.reverse();
 const s=sc14.reduce((a,b)=>a+b,0);
 $('#st').innerHTML='<div class="panel" style="width:min(820px,100%)"><div class="trw14"><div class="tr14" id="tr14">'+ws.map((w,k)=>'<div class="cr14" id="cr'+k+'" onclick="m14car('+k+')"><div class="cp14">'+ph(w)+'</div><div class="cs14" id="cs'+k+'"></div></div>').join('<div class="cn14"></div>')+'<div class="cn14"></div><div class="eng14"><i class="sm s1"></i><i class="sm s2"></i><i class="sm s3"></i><i class="chm"></i><i class="bl"></i><i class="cab"></i><i class="wh w1"></i><i class="wh w2"></i><i class="wh w3"></i></div></div><div class="rail14"></div></div><div class="wg14 pool" id="pl14"></div><div class="say" id="sy" style="min-height:30px">Tap a word. Tap a train car!</div><div class="row"><button onclick="m14h()">Hint</button><button class="go" onclick="m14ck()">Check</button></div><div class="say" id="sb14" style="font-size:16px;min-height:0">Train '+(i14+1)+' of 5</div></div></div>';m14d()}
function m14d(){
 $('#pl14').innerHTML=pl14.map((x,k)=>'<button class="wc14'+(x.u?' u':'')+(sel14==k?' sel':'')+'" onclick="m14w('+k+')">'+x.w+'</button>').join('');
 for(let k=0;k<3;k++){const c=cr14[k],e=$('#cs'+k);if(!e)continue;e.textContent=c?c.w:'';e.className='cs14'+(c?' f':'')+(c&&c.l?' ok':'')}}
function m14w(k){if(dn14||pl14[k].u)return;sel14=sel14==k?-1:k;m14d()}
function m14car(k){if(dn14)return;const c=cr14[k];if(c&&c.l)return;
 if(sel14<0){if(c){c.u=0;cr14[k]=null;m14d()}return}
 if(c)c.u=0;const x=pl14[sel14];x.u=1;cr14[k]=x;sel14=-1;m14d()}
function m14h(){if(dn14)return;hn14=1;const ws=TR14[i14];
 for(let k=0;k<3;k++){const c=cr14[k];if(!c||c.w!=ws[k]){if(c)c.u=0;const x=pl14.find(y=>y.w==ws[k]&&!y.l);if(x.u){const o=cr14.findIndex(z=>z===x);cr14[o]=null}x.u=1;x.l=1;cr14[k]=x;sel14=-1;m14d();say('<span class="ans">One car is loaded for you!</span>');return}}}
function m14ck(){if(dn14)return;const ws=TR14[i14];
 if(cr14.some(c=>!c)){say('<span class="ans" style="color:#c0392b">Fill all 3 cars!</span>');return}
 let bad=0;cr14.forEach((c,k)=>{if(c.w==ws[k])c.l=1;else bad++});
 if(bad){wr14++;cr14.forEach((c,k)=>{if(!c.l){c.u=0;cr14[k]=null;const e=$('#cr'+k);e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake')}});sel14=-1;m14d();say('<span class="ans" style="color:#c0392b">Almost! Try again.</span>');return}
 dn14=true;m14d();const p=Math.max(1,3-(hn14?1:0)-wr14);sc14.push(p);$('#pl14').style.display='none';
 setTimeout(()=>{const t=$('#tr14');if(t){t.classList.add('go');m14snd()}},500);
 say('<span class="ans" style="color:#1f8a4c">All aboard!</span>');

 const w=C.createOscillator(),g=C.createGain();w.type='triangle';w.frequency.setValueAtTime(520,t);w.frequency.linearRampToValueAtTime(430,t+.7);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(.12,t+.05);g.gain.linearRampToValueAtTime(.0001,t+.8);w.connect(g);g.connect(C.destination);w.start(t);w.stop(t+.85);
