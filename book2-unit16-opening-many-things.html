<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Opening Many Things</title>
<style>
:root{--ink:#2b2a3a;--a:#8c5a2b;--b:#2a9d8f;--sun:#ffd84a;--bg1:#fdf0dc;--bg2:#cfe8e2;--red:#ff5c5c;--ok:#2fb86a;box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Baloo 2","Comic Sans MS","Chalkboard SE",system-ui,sans-serif;background:linear-gradient(var(--bg1),var(--bg2));color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:8px;padding:6px 14px;flex-wrap:wrap}
.tab{padding:5px 14px;border-radius:99px;background:#fff9;font-weight:700;font-size:15px;cursor:pointer}
.tab.on{background:var(--a);color:#fff}
#h{flex:1;font-size:clamp(17px,2.6vw,26px);font-weight:800;min-width:150px}
#t{font-size:28px;font-weight:800;background:#fff;border-radius:14px;padding:0 12px;min-width:86px;text-align:center}
#t.low{background:var(--red);color:#fff}
button{font:inherit;font-weight:800;border:0;border-radius:14px;padding:8px 16px;background:var(--sun);color:var(--ink);cursor:pointer}
button.sm{background:#fff;padding:6px 12px;font-size:15px;opacity:.85}
button.go{background:var(--a);color:#fff;font-size:20px;padding:10px 24px}
button:disabled{opacity:.4;cursor:default}
main{flex:1;min-height:0;display:flex;gap:14px;align-items:center;justify-content:center;padding:4px 14px 8px}
.panel{background:#fff;border-radius:22px;padding:12px 16px;box-shadow:0 6px 0 #0002;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.say{font-size:clamp(18px,2.8vh,26px);font-weight:800;min-height:30px}
.ans{color:#c0392b}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.row button{background:#ffe9a8;font-size:15px}
.pl{background:repeating-linear-gradient(45deg,#e9e4f5,#e9e4f5 10px,#f4f1fb 10px,#f4f1fb 20px);border:3px dashed #b9b0d8;border-radius:16px;display:grid;place-items:center;color:#7a6fa8;font-weight:800;text-align:center;padding:4px;aspect-ratio:1;min-width:0}
.pl span{font-size:clamp(11px,2vh,18px);line-height:1.1}
img.ph,.pl{width:100%;aspect-ratio:1}
img.ph{object-fit:cover;border-radius:16px;display:block}
#tip{padding:6px 16px;background:#fff9;font-size:14px;max-height:36vh;overflow:auto;display:none}
#tip ol{margin:4px 0 6px;padding-left:22px}#tip li{margin:2px 0}
#ro{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9}
#ro>div{background:#fff;border-radius:24px;padding:26px 36px;text-align:center;font-size:clamp(24px,5vw,40px);font-weight:800;max-width:90vw}
#ro small{display:block;font-size:18px;font-weight:700;margin:8px 0 14px;color:#666}
.star{display:inline-block;width:1em;height:1em;background:var(--sun);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);vertical-align:-.1em}
.qb{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(560px,100%)}
.qc{position:relative;aspect-ratio:1.25;border-radius:16px;border:5px solid var(--a);background:var(--bg2);color:var(--a);font-size:clamp(34px,7vh,60px);font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;padding:6px}
.qc u{position:absolute;top:3px;left:8px;font-size:13px;text-decoration:none;background:#fffc;border-radius:6px;padding:0 5px;color:var(--ink)}
.qc.dn{background:#e8f5e9;border-color:#9bd3ae;color:var(--ink);opacity:.65;font-size:clamp(13px,2.2vh,20px);line-height:1.2}
.qc.dn.on{background:#fff2a8;border-color:var(--red);opacity:1}
.qbig{font-size:clamp(26px,5vh,42px);font-weight:800;line-height:1.2}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:none}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pop .45s}
.row button.go{background:var(--a);color:#fff}.shake{animation:shake .35s}
#t,#tb{display:none!important}
.lg{display:grid;grid-template-columns:repeat(var(--c,4),min(var(--s,17vh),130px));gap:8px;justify-content:center}
.lt{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#fff;border:4px solid #fff;box-shadow:0 2px 0 #0002;cursor:pointer}
.lt .ph,.lt .pl{width:100%;height:100%;border-radius:0}
.lt .lbd{position:absolute;left:0;right:0;bottom:0;background:var(--a);color:#fff;font-weight:800;text-align:center;font-size:clamp(12px,2.1vh,17px);padding:3px 0;display:none}
.lt.sw .lbd{display:block}
.ok7{background:#2eae60!important;color:#fff!important}
.wr8{background:#e05a4f!important;color:#fff!important}
.av{width:clamp(70px,13vh,100px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:clamp(30px,6vh,50px)}
.nmt{font-size:clamp(20px,3.6vh,30px);font-weight:800}
.tg{position:absolute;left:0;right:0;bottom:0;z-index:5;color:#fff;font-weight:800;font-size:clamp(11px,2vh,16px);text-align:center;padding:2px;background:var(--a)}
.fill{position:relative;overflow:hidden}
.fill .ph,.fill .pl{position:absolute;inset:0;width:100%;height:100%;border-radius:0}
.lt{overflow:visible}.lt .ph,.lt .pl{border-radius:8px}
.qm3{position:absolute;right:-7px;top:-7px;width:26px;height:26px;border-radius:50%;background:var(--b);color:#fff;font-size:16px;line-height:26px;text-align:center;font-weight:800;z-index:6;box-shadow:0 2px 0 #0003;animation:qm3p 1s infinite alternate;pointer-events:none}
.lt.sw .qm3{background:#2e9e5b;animation:none}
@keyframes qm3p{to{transform:scale(1.25)}}
.lt .lbd{border-radius:0 0 8px 8px}
.roof16{width:0;height:0;margin:2px auto 0;border-left:min(46%,380px) solid transparent;border-right:min(46%,380px) solid transparent;border-bottom:clamp(30px,6vh,52px) solid var(--b);width:min(92%,760px);border-left-width:0;border-right-width:0;border-bottom:0;height:clamp(30px,6vh,50px);background:var(--b);clip-path:polygon(50% 0,100% 100%,0 100%)}
.hs16{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(92%,760px);margin:0 auto;padding:10px;border:6px solid var(--a);border-top:0;border-radius:0 0 14px 14px;background:#fff8ea}
.hc16{position:relative;aspect-ratio:1.15;border-radius:12px;overflow:hidden;border:4px solid #fff;box-shadow:0 2px 0 #0002;cursor:pointer;background:#fff}
.hc16 .ph,.hc16 .pl{position:absolute;inset:0;width:100%;height:100%;border-radius:0}
.hw16{position:absolute;left:0;right:0;bottom:0;background:#2b2a3add;color:#fff;font:800 clamp(16px,2.8vh,22px) sans-serif;text-align:center;padding:3px;display:none}
.hc16.ok{border-color:#2eae60;transform:scale(1.04)}.hc16.ok .hw16{display:block}.hc16.dim{opacity:.25;pointer-events:none}
.m16{display:flex;gap:18px;align-items:center;justify-content:center;margin:6px 0}
.p16,.dw16{position:relative;width:min(30vh,220px);aspect-ratio:1;border-radius:14px;overflow:hidden;border:5px solid #fff;box-shadow:0 3px 0 #0002;background:#fff}
.p16 .ph,.p16 .pl,.in16 .ph,.in16 .pl{position:absolute;inset:0;width:100%;height:100%;border-radius:0}
.arr16{font-size:clamp(30px,6vh,50px);color:var(--a)}
.dw16{cursor:pointer;background:#5a3a1f;overflow:visible;perspective:700px;border:0;box-shadow:none}
.in16{position:absolute;inset:0;border-radius:10px;overflow:hidden;border:5px solid #5a3a1f}
.lf16{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(#b5763a,#8c5a2b);border:3px solid #5a3a1f;transition:transform .9s}
.lf16.l1{left:0;transform-origin:left center;border-radius:10px 0 0 10px}.lf16.l2{right:0;transform-origin:right center;border-radius:0 10px 10px 0}
.hd16{position:absolute;top:50%;left:calc(50% - 14px);width:8px;height:8px;border-radius:50%;background:#ffd84a;box-shadow:12px 0 #ffd84a;z-index:2;transition:opacity .4s}
.dw16.open .l1{transform:rotateY(-105deg)}.dw16.open .l2{transform:rotateY(105deg)}.dw16.open .hd16{opacity:0}
.dw16.bx .l1{transition:transform .8s,opacity .8s;width:100%;border-radius:10px;left:0;top:0;bottom:0;background:linear-gradient(#e0a458,#c98a3c);transform-origin:top center}
.dw16.bx .l2{display:none}.dw16.bx.open .l1{transform:translateY(-34%) rotate(-10deg);opacity:0}
.dw16:not(.open)::after{content:"Tap!";position:absolute;left:0;right:0;bottom:6px;text-align:center;font:800 clamp(14px,2.4vh,18px) sans-serif;color:#fff;animation:lp15 1.4s infinite;z-index:3}
.m16b{display:flex;gap:22px;align-items:center;justify-content:center}
.gg16{display:grid;grid-template-columns:repeat(3,min(17vh,126px));gap:12px}
.gb16{position:relative;aspect-ratio:1;border-radius:12px;background:#d9534f;cursor:pointer;box-shadow:0 3px 0 #0003}
.gb16:nth-child(even){background:#2a9d8f}
.gb16::before{content:"";position:absolute;left:calc(50% - 6px);top:0;bottom:0;width:12px;background:#ffd84a}
.gi16{position:absolute;inset:6px;border-radius:8px;overflow:hidden;background:#fff;opacity:0}
.gi16 .ph,.gi16 .pl{position:absolute;inset:0;width:100%;height:100%;border-radius:0}
.gt16{position:absolute;left:0;right:0;bottom:0;background:#2b2a3add;color:#fff;font:800 14px sans-serif;text-align:center;padding:2px}
.gl16{position:absolute;left:-4px;right:-4px;top:-4px;height:34%;border-radius:10px;background:inherit;filter:brightness(1.15);box-shadow:0 2px 0 #0003;transition:transform .5s,top .5s}
.gr16{position:absolute;left:0;right:0;bottom:6px;text-align:center;font:800 clamp(22px,4vh,32px) sans-serif;color:#fff}
.gb16.op .gl16{transform:translateY(-22px) rotate(-14deg)}.gb16.op .gi16{opacity:1}.gb16.op .gr16{opacity:0}
.gb16.dn{opacity:.55}.gb16.dn::before{display:none}
.m16r{min-width:min(34vh,300px);max-width:340px;display:flex;flex-direction:column;gap:8px}
.gg16{padding-top:16px}
.bxr16{display:flex;gap:60px;align-items:flex-end;justify-content:center;min-height:clamp(200px,38vh,270px);margin:4px 0}
.bw16{position:relative;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.bo16{position:relative;background:#c98a3c;border-radius:6px;box-shadow:0 3px 0 #0003}
.bo16.bg{width:clamp(150px,27vh,210px);height:clamp(120px,22vh,170px)}.bo16.sm{width:clamp(80px,14vh,110px);height:clamp(64px,11vh,88px)}
.bb16{position:absolute;left:calc(50% - 7px);top:0;bottom:0;width:14px;background:#ffd84a}
.bl16{position:absolute;left:-5px;right:-5px;top:-14px;height:26%;background:#e0a458;border-radius:6px;box-shadow:0 2px 0 #0003;transition:transform .6s;transform-origin:left bottom;z-index:2}
.bw16.open .bl16{transform:translateY(-12px) rotate(-22deg)}
.it16{position:absolute;bottom:62%;width:clamp(110px,22vh,170px);aspect-ratio:1;border-radius:12px;overflow:hidden;border:4px solid #fff;box-shadow:0 3px 0 #0003;background:#fff;opacity:0;transform:translateY(40px) scale(.5);transition:all .6s .2s;z-index:1}
.it16 .ph,.it16 .pl{position:absolute;inset:0;width:100%;height:100%;border-radius:0}
.bw16.open .it16{opacity:1;transform:none}.bw16.dim{opacity:.35;pointer-events:none}
.str16{display:flex;gap:12px;justify-content:center;align-items:flex-end;margin:8px 0;min-height:clamp(180px,34vh,250px)}
.sc16{position:relative;width:clamp(92px,16.5vh,128px);opacity:.4;transition:opacity .3s,transform .3s;padding-top:44px}
.sc16.cur{opacity:1}.sc16.dn{opacity:.8}
.sp16{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;border:4px solid #fff;box-shadow:0 3px 0 #0003;background:#fff}
.sp16 .ph,.sp16 .pl{position:absolute;inset:0;width:100%;height:100%;border-radius:0}
.sc16.s0 .sp16{cursor:pointer;box-shadow:0 0 0 4px #ffd84a,0 0 18px #ffd84a}
.sc16.shown .sp16{transform:scale(1.08)}
.sd16{position:relative;height:clamp(34px,6vh,48px);margin-top:8px;border-radius:8px;background:#5a3a1f;overflow:hidden;perspective:300px}
.sc16.s1 .sd16{cursor:pointer;box-shadow:0 0 0 4px #ffd84a;animation:lp15 1.2s infinite}
.sl{position:absolute;top:0;bottom:0;width:50%;background:linear-gradient(#b5763a,#8c5a2b);border:2px solid #5a3a1f;transition:transform .7s}
.sl.l1{left:0;transform-origin:left center}.sl.l2{right:0;transform-origin:right center}
.sc16.opened .l1{transform:rotateY(-100deg)}.sc16.opened .l2{transform:rotateY(100deg)}
.sc16.dn .sd16{background:#2b2a3a}.sc16.dn .sl{transform:rotateY(100deg)}.sc16.dn .l1{transform:rotateY(-100deg)}
.hand16{position:absolute;top:0;left:50%;transform:translateX(-50%);font:800 clamp(14px,2.4vh,18px) sans-serif;background:#ff6b35;color:#fff;border-radius:99px;padding:3px 14px;animation:hb16 .8s infinite alternate}
.hand16::after{content:"";position:absolute;left:calc(50% - 8px);bottom:-8px;border:8px solid transparent;border-top-color:#ff6b35;border-bottom:0}
@keyframes hb16{to{transform:translate(-50%,-6px)}}
.gst16{display:flex;justify-content:flex-start;padding-left:4%}
.gv16{display:flex;align-items:center;gap:10px}
.gc16{width:clamp(44px,8vh,60px);height:clamp(44px,8vh,60px);border-radius:50%;background:var(--b);color:#fff;font:800 clamp(12px,2vh,15px) sans-serif;display:grid;place-items:center}
.gb{background:#fff;border:3px solid var(--b);border-radius:14px;padding:4px 14px;font:800 clamp(16px,2.8vh,22px) sans-serif}
.sc16.shown.cur .sp16{box-shadow:0 0 0 4px #2eae60}
.pw16{position:relative;padding-top:clamp(44px,8vh,60px)}
.fg16{position:absolute;top:0;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;animation:hb16 .8s infinite alternate;z-index:4}
.fg16 span{font:800 clamp(16px,3vh,24px) sans-serif;background:#ff6b35;color:#fff;border-radius:99px;padding:3px 14px;white-space:nowrap}
.fg16 svg{transform:rotate(0deg);width:clamp(24px,4.4vh,34px);height:auto;margin-bottom:-14px}
.p16.hl{cursor:pointer;box-shadow:0 0 0 4px #ffd84a,0 0 18px #ffd84a}.p16.shown{box-shadow:0 0 0 4px #2eae60}
.dw16.rdy{animation:lp15 1.2s infinite}
.fg16 span{font-size:clamp(17px,3.2vh,26px);padding:6px 20px;border-radius:50px;box-shadow:0 3px 0 #0003}
.pw16{padding-top:clamp(52px,9.5vh,70px)}
.em16{font-style:normal;font-size:clamp(30px,5.4vh,44px);line-height:1;margin-left:4px}

</style></head><body>

const LBL={"u16_house": "house", "u16_door": "door", "u16_open": "open", "u16_closet": "closet", "u16_small": "small box", "u16_room": "room", "u16_big": "big box", "u16_look": "look", "u16_ball": "ball", "u16_bear": "teddy bear", "u16_book": "book", "u16_cake": "cake", "u16_car": "toy car", "u16_hat": "hat"};
function ph(k,c){return IMG[k]?'<img class="ph '+(c||'')+'" src="'+IMG[k]+'" alt="">':'<div class="pl '+(c||'')+'"><span>'+(LBL[k]||k)+'</span></div>'}
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const DUR=[180, 180, 360];
let cur=0,secs=0,iv=null;
function fmt(){$('#t').textContent=Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0');$('#t').classList.toggle('low',secs<=30)}
function tog(){if(iv){clearInterval(iv);iv=null;$('#tb').textContent='Start'}else{iv=setInterval(()=>{secs>0?(secs--,fmt()):tog()},1000);$('#tb').textContent='Pause'}}
function tgl(){const t=$('#tip');t.style.display=t.style.display=='block'?'none':'block'}
function say(h){$('#sy').innerHTML=h}
function fin(){celebrate('Opening Many Things!','Now look inside!')}
function celebrate(m,s){$('#rm').innerHTML=m;$('#rs').textContent=s||'';$('#ro').style.display='flex'}
function qcards(el,QS){
  const cells=QS.map(x=>({...x}));let last=-1;
  el.innerHTML='<div class="qb" id="qb"></div><div class="panel" id="qp" style="width:min(440px,100%);min-height:260px"><div class="qbig" id="qq">Tap a card!</div><div class="say" id="sy"></div><div class="row" id="qr"></div></div>';
  cells.forEach((c,i)=>{const d=document.createElement('div');d.className='qc';d.id='q'+i;d.innerHTML='<u>'+(i+1)+'</u>?';d.onclick=()=>{
    if(c.dn)return;c.dn=1;document.querySelectorAll('.qc').forEach(e=>e.classList.remove('on'));
    d.className='qc dn on pop';d.innerHTML='<u>'+(i+1)+'</u>'+c.q;
    $('#qq').textContent=c.q;say('');
    $('#qr').innerHTML='<button onclick="say(\'<span class=ans>'+c.h.replace(/'/g,"\\'")+'</span>\')">Hint</button><button onclick="say(\'<span class=ans>'+c.f.replace(/'/g,"\\'")+'</span>\')">Follow-up question</button>';
    if(cells.every(x=>x.dn))setTimeout(()=>celebrate('All cards open!','Great talking!'),700)};
    $('#qb').appendChild(d)});
}
const A=[];
function go(i){if(iv)tog();cur=i;secs=DUR[i];fmt();
  document.querySelectorAll('.tab').forEach((e,j)=>e.classList.toggle('on',j==i));
  $('#nx').style.display=i==A.length-1?'none':'';$('#fn').style.display=i==A.length-1?'':'none';
  $('#tt').innerHTML=A[i].tip;$('#h').textContent=A[i].h;$('#st').innerHTML='';A[i].run($('#st'))}

/* shared helpers */
function Llearn(el,items,start,title){const n=items.length;
 el.innerHTML='<div class="panel" style="width:auto"><div class="lg" style="--c:'+(n<=6?3:4)+'">'+items.map((x,i)=>'<div class="lt" id="lt'+i+'">'+ph(x[0])+'<div class="lbd">'+x[1]+'</div><b class="qm3">?</b></div>').join('')+'</div><div class="say" id="sy">'+(title||'Tap a picture. The word appears!')+'</div><div class="say" id="lc" style="font-size:15px;min-height:0">0 of '+n+' words</div><div class="row"><button class="go" onclick="'+start+'()">Start the game!</button></div></div>';
 items.forEach((x,i)=>{$('#lt'+i).onclick=()=>{const t=$('#lt'+i);t.classList.add('sw');const q=t.querySelector('.qm3');if(q)q.textContent='\u2713';t.style.animation='pop .4s';const k=document.querySelectorAll('.lt.sw').length;const c=$('#lc');if(c)c.textContent=k+' of '+n+' words'+(k>=n?' \u00b7 Great!':'');say('<span class="ans">'+x[1]+'</span>')}})}
const LB={sc:[],ph:0,hn:0,n:0,N:0,max:3,hint:null,reveal:null,render:null,fin:['','']};
function Lbtns(){return '<div class="row" id="lbr"><button onclick="Lhint()">Hint</button><button class="go" id="gob" onclick="Lgo()">Check answer</button><button class="ok7" id="okb" onclick="Lok()" style="display:none">Correct!</button><button class="wr8" id="wrb" onclick="Lwr()" style="display:none">Wrong</button></div><div class="say" id="sn" style="font-size:16px;min-height:0"></div>'}
function Lstart(N,render,hint,reveal,fin){LB.sc=[];LB.ph=0;LB.hn=0;LB.n=0;LB.N=N;LB.render=render;LB.hint=hint;LB.reveal=reveal;LB.fin=fin;render()}
function Lbar(){const s=LB.sc.reduce((a,b)=>a+b,0),e=$('#sn');if(e)e.innerHTML='Round '+(LB.n+1)+' of '+LB.N+' · <span class="star"></span> '+s+' / '+(LB.N*3)}
function Lnew(){LB.ph=0;LB.hn=0}
function Lhint(){if(LB.ph!=0)return;LB.hn=1;say('<span class="ans">'+LB.hint()+'</span>')}
function Lgo(){if(LB.ph==0){LB.ph=1;say('<span class="ans">'+LB.reveal()+'</span> Did the student say it?');$('#gob').style.display='none';$('#okb').style.display='';$('#wrb').style.display='';return}
 if(LB.ph==2){if(LB.n>=LB.N-1){const s=LB.sc.reduce((a,b)=>a+b,0);celebrate(LB.fin[0],LB.fin[1].replace('#',s+' of '+LB.N*3+' stars'));return}LB.n++;Lnew();LB.render()}}
function Lok(){Ljd(LB.hn?2:3)}function Lwr(){Ljd(0)}
function Ljd(p){if(LB.ph!=1)return;LB.sc.push(p);LB.ph=2;$('#okb').style.display='none';$('#wrb').style.display='none';const g=$('#gob');g.style.display='';g.textContent=LB.n>=LB.N-1?'Finish':'Next round';say(p?'<span class="ans" style="color:#1f8a4c">Great! +'+p+' stars</span>':'<span class="ans" style="color:#c0392b">Good try! Next time!</span>');Lbar()}

/* auto-fit: enlarge the main panel to use the laptop screen */
function Lfit(){const st=document.getElementById('st');if(!st)return;const p=st.firstElementChild;if(!p||!p.classList.contains('panel'))return;
 p.style.zoom=1;const aw=st.clientWidth-8,ah=st.clientHeight-8,r=p.getBoundingClientRect();let z=Math.min(1.6,aw/r.width,(ah-44)/r.height);if(z<1.06){return}
 for(let i=0;i<12;i++){p.style.zoom=z;const q=p.getBoundingClientRect();if(q.width<=aw&&q.height<=ah-40)break;z*=.95}if(z<1.04)p.style.zoom=1}
(function(){let t=0;const go=()=>{cancelAnimationFrame(t);t=requestAnimationFrame(()=>requestAnimationFrame(Lfit))};
 document.addEventListener('DOMContentLoaded',()=>{const st=document.getElementById('st');if(st)new MutationObserver(go).observe(st,{childList:true});window.addEventListener('resize',go);go()})})();
const L16=[['u16_house','house'],['u16_door','door'],['u16_open','open'],['u16_closet','closet'],['u16_small','small'],['u16_room','room'],['u16_big','big'],['u16_look','look']];
let r16=[],i16=0,dn16=false;
A.push({h:'1. Find It!',tip:'<ol><li>FIRST (Look &amp; Say): eight pictures. The student taps a picture, says the word, and the word appears.</li><li>Press "Start the game!" 6 rounds. Eight pictures sit in a house. Say, "Find the closet!" The student taps the picture. A wrong picture shakes ("Try again!"). The right picture turns green and its word appears. The student says the word.</li><li>Hint = the wrong pictures fade (3 at a time). Press "Next." 6 rounds (words are mixed each time).</li></ol>',run:el=>{Llearn(el,L16,'m16s')}});
function m16s(){r16=shuf([0,1,2,3,4,5,6,7]).slice(0,6);i16=0;m161()}
function m16p(k){const w=L16[k][1];return ['house','door','closet','room'].indexOf(w)>=0?'Find the '+w+'!':'Find “'+w+'”!'}
function m161(){dn16=false;const t=r16[i16],o=shuf([0,1,2,3,4,5,6,7]);
 $('#st').innerHTML='<div class="panel" style="width:min(860px,100%)"><div class="say" style="font-size:15px;min-height:0">Round '+(i16+1)+' of 6</div><div class="qbig" style="font-size:clamp(20px,3.6vh,30px)">'+m16p(t)+'</div><div class="roof16"></div><div class="hs16" id="hs16">'+o.map(x=>'<div class="hc16" id="hc'+x+'" onclick="m16k('+x+')">'+ph(L16[x][0])+'<div class="hw16">'+L16[x][1]+'</div></div>').join('')+'</div><div class="say" id="sy" style="min-height:30px">Tap the picture!</div><div class="row" id="rw"><button onclick="m16h()">Hint</button></div></div>'}
function m16h(){if(dn16)return;const t=r16[i16];let n=0;[...document.querySelectorAll('.hc16')].forEach(e=>{if(e.id!='hc'+t&&!e.classList.contains('dim')&&n<3){e.classList.add('dim');n++}});say('<span class="ans">Look again!</span>')}
function m16k(x){if(dn16)return;const t=r16[i16],e=$('#hc'+x);
 if(x==t){dn16=true;document.querySelectorAll('.hc16').forEach(b=>{if(b!==e)b.classList.add('dim')});e.classList.add('ok');say('<span class="ans" style="color:#1f8a4c">Yes! Say it!</span>');$('#rw').innerHTML='<button class="go" onclick="m16n()">'+(i16>=5?'Finish':'Next')+'</button>'}
 else{e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake');say('<span class="ans" style="color:#c0392b">Try again!</span>')}}
function m16n(){if(i16>=5){celebrate('Great job!','You found them all!');return}i16++;m161()}
/* Mission 2 */
const T16=[['u16_house','house','door'],['u16_room','room','door'],['u16_closet','closet','door'],['u16_big','big box','box'],['u16_small','small box','box']];
const I16=[['u16_ball','a ball'],['u16_bear','a teddy bear'],['u16_book','a book'],['u16_cake','a cake'],['u16_car','a toy car'],['u16_hat','a hat']];
const PM16='<i class="em16">\u{1F932}</i>';
const HD16='<svg viewBox="0 0 40 60" width="34" height="50"><rect x="15" y="26" width="10" height="30" rx="5" fill="#ffd8a8" stroke="#b5651d" stroke-width="2"/><rect x="5" y="6" width="30" height="26" rx="9" fill="#ffd8a8" stroke="#b5651d" stroke-width="2"/><rect x="1" y="14" width="10" height="16" rx="5" fill="#ffd8a8" stroke="#b5651d" stroke-width="2" transform="rotate(20 6 22)"/></svg>';
let n16=0,st16=0,op16=false,it16=0;
A.push({h:'2. Show and Tell',tip:'<ol><li>"Here is..." means "Here it is! Look, it is here." The student is the GUIDE and shows things to a guest (the teacher). A hand points to the picture and an orange oval shows "Here is a ___." so the student can read the frame and say the whole sentence.</li><li>For each stop: the student says "Here is a house." and taps the picture (SHOW it). Then the hand moves to the door (or box). The student says "Open the door." (or "Open the box.") and taps it. The door opens and the NEXT thing is inside: house, room, closet, big box, small box.</li><li>At the last box, a surprise picture pops out: say "Now look inside! Here is a ball." Press "Next stop." Hint = the sentence frame. Check = the sentence. 5 stops.</li></ol>',run:el=>{n16=0;it16=Math.floor(Math.random()*6);m162(el)}});
function m162(el){el=el||$('#st');st16=0;op16=false;const c=T16[n16],nx=n16<4?T16[n16+1]:I16[it16],bx=n16>=3;
 el.innerHTML='<div class="panel" style="width:min(860px,100%)"><div class="say" style="font-size:15px;min-height:0">Stop '+(n16+1)+' of 5</div><div class="gst16"><div class="gv16"><div class="gc16">Guest</div><div class="gb">Show me!</div></div></div><div class="m16"><div class="pw16"><div class="fg16" id="fg0"><span>Here is a ___.</span>'+HD16+'</div><div class="p16 hl" id="pc" onclick="m16sh()">'+ph(c[0])+'</div></div><div class="arr16">&#10140;</div><div class="pw16"><div class="fg16" id="fg1" style="display:none"><span>Open the ___.</span>'+HD16+'</div><div class="dw16'+(bx?' bx':'')+'" id="dw" onclick="m16op()"><div class="in16">'+ph(nx[0])+'</div><div class="lf16 l1"></div><div class="lf16 l2"></div><div class="hd16"></div></div></div></div><div class="say" id="sy" style="min-height:34px">Say it. Then tap the picture!</div><div class="row" id="rw"><button onclick="m16h2()">Hint</button><button onclick="m16c()">Check</button><button class="go" id="nb" onclick="m16x()" disabled>'+(n16>=4?'Finish':'Next stop')+'</button></div></div>'}
function m16h2(){const c=T16[n16];say('<span class="ans">'+(st16==0?'Here is a ___.':op16?'Now look! Here is ___.':'Open the '+c[2]+'.')+'</span>')}
function m16c(){const c=T16[n16],nx=n16<4?T16[n16+1][1]:I16[it16][1].replace(/^a /,'');say('<span class="ans">'+(st16==0?'Here is a '+c[1]+'.':op16?(n16>=4?'Now look inside! Here is '+I16[it16][1]+'.':'Here is a '+nx+'.'):'Open the '+c[2]+'.')+'</span>')}
function m16sh(){if(st16!=0)return;st16=1;$('#pc').classList.remove('hl');$('#pc').classList.add('shown');{const f=$('#fg0');f.style.animation='none';f.innerHTML='<span>Here is a '+T16[n16][1]+'.</span>'+PM16}$('#fg1').style.display='';$('#dw').classList.add('rdy');say('<span class="ans" style="color:#1f8a4c">Here is a '+T16[n16][1]+'. Now open the '+T16[n16][2]+'!</span>')}
function m16op(){if(st16!=1||op16)return;op16=true;$('#dw').classList.remove('rdy');$('#dw').classList.add('open');$('#fg1').style.display='none';const b=$('#nb');if(b)b.disabled=false;say('<span class="ans" style="color:#1f8a4c">'+(n16>=4?'Now look inside! What is it?':'Look! What is inside?')+'</span>')}
function m16x(){if(!op16)return;if(n16>=4){setTimeout(()=>celebrate('Opening Many Things!','Now look inside!'),500);return}n16++;m162()}
/* Mission 3 */
const D16=[['u16_small','small box','What do you want in a small box?','Why?','I want ___ in a small box.','I want a ring in a small box. It is pretty.'],['u16_closet','closet','What do you hide in your closet?','Where is your closet?','I hide ___ in my closet.','I hide my toys in my closet. It is in my room.'],['u16_big','big box','What do you want in a big box?','Is it big or small?','I want ___ in a big box.','I want a teddy bear in a big box. It is big.'],['u16_room','room','Is your room big or small?','What is in your room?','My room is ___.','My room is small. I have a bed and a desk.'],['u16_door','door','Who opens the door at your house?','What do you say?','___ opens the door.','My mom opens the door. I say, “Hello!”'],['u16_look','look','What do you like to look at?','Why do you like it?','I like to look at ___.','I like to look at the sky. It is pretty.']];
let o16=[],c16=-1,d16=[];
A.push({h:'3. My Secret Box',tip:'<ol><li>PERSONALIZATION: the student talks about HIS/HER OWN things. Six gift boxes. The student taps a box; the lid pops open and shows a picture.</li><li>Ask the question, then the "Tell me more" line, so the student says 2-3 sentences. Hint = starter. Check = sample answer.</li><li>Press "Next box." 6 boxes in all.</li></ol>',run:el=>{o16=shuf([0,1,2,3,4,5]);c16=-1;d16=[];m163(el)}});
function m163(el){el=el||$('#st');
 const bx=o16.map((x,i)=>'<div class="gb16'+(c16==i?' op':'')+(d16.indexOf(i)>=0&&c16!=i?' op dn':'')+'" onclick="m16g('+i+')"><div class="gi16">'+ph(D16[x][0])+'<div class="gt16">'+D16[x][1]+'</div></div><div class="gl16"></div><div class="gr16">'+(i+1)+'</div></div>').join('');
 let q='Pick a box!';if(c16>=0){const b=D16[o16[c16]];q=b[2]+'<div style="font-size:.68em;font-weight:600;opacity:.85;margin-top:6px">Tell me more: '+b[3]+'</div>'}
 el.innerHTML='<div class="panel" style="width:min(900px,100%)"><div class="say" style="font-size:15px;min-height:0">Box <b>'+Math.min(d16.length+(c16>=0?0:1),6)+'</b> of 6</div><div class="m16b"><div class="gg16">'+bx+'</div><div class="m16r"><div class="qbig" style="font-size:clamp(19px,3.4vh,28px)">'+q+'</div><div class="say" id="sy" style="min-height:30px"></div></div></div><div class="row"><button onclick="m16h3()">Hint</button><button onclick="m16k3()">Check</button><button class="go" '+(c16<0?'disabled':'')+' onclick="m16n3()">'+(d16.length>=6?'Finish':'Next box')+'</button></div></div>'}
function m16g(i){if(d16.indexOf(i)>=0)return;if(c16>=0&&d16.indexOf(c16)<0)return;c16=i;if(d16.indexOf(i)<0)d16.push(i);m163()}
function m16h3(){if(c16<0)return;say('<span class="ans">'+D16[o16[c16]][4]+'</span>')}
function m16k3(){if(c16<0)return;say('<span class="ans">'+D16[o16[c16]][5]+'</span>')}
function m16n3(){if(c16<0)return;if(d16.length>=6){setTimeout(()=>celebrate('Opening Many Things!','Now look inside!'),500);return}c16=-1;m163()}

A.forEach((a,i)=>{const d=document.createElement('div');d.className='tab';d.textContent='Mission '+(i+1);d.onclick=()=>go(i);$('#tabs').appendChild(d)});
go(0);
</script></body></html>
