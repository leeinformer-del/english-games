<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gift Unwrap – Under the Christmas Tree</title>
<style>
:root{--ink:#2b2a3a;--a:#c0392b;--b:#2e7d32;--sun:#ffd84a;--bg1:#e8f5e9;--bg2:#c8e6c9;--red:#ff5c5c;--ok:#2fb86a;box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Baloo 2","Comic Sans MS","Chalkboard SE",system-ui,sans-serif;background:linear-gradient(var(--bg1),var(--bg2));color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:8px;padding:6px 14px;flex-wrap:wrap}
.tab{padding:5px 14px;border-radius:99px;background:#fff9;font-weight:700;font-size:15px;cursor:pointer}
.tab.on{background:var(--a);color:#fff}
#h{flex:1;font-size:clamp(17px,2.6vw,26px);font-weight:800;min-width:150px}
#t{font-size:28px;font-weight:800;background:#fff;border-radius:14px;padding:0 12px;min-width:86px;text-align:center}
#t.low{background:var(--red);color:#fff}
button{font:inherit;font-weight:800;border:0;border-radius:14px;padding:8px 16px;background:var(--sun);color:var(--ink);cursor:pointer}
button.sm{background:#fff;padding:6px 12px;font-size:15px;opacity:.85}
button.go{background:var(--a);color:#fff;font-size:20px;padding:10px 24px}
button:disabled{opacity:.4;cursor:default}
main{flex:1;min-height:0;display:flex;gap:14px;align-items:center;justify-content:center;padding:4px 14px 8px}
.panel{background:#fff;border-radius:22px;padding:12px 16px;box-shadow:0 6px 0 #0002;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.say{font-size:clamp(18px,2.8vh,26px);font-weight:800;min-height:30px}
.ans{color:#c0392b}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.row button{background:#ffe9a8;font-size:15px}
.pl{background:repeating-linear-gradient(45deg,#e9e4f5,#e9e4f5 10px,#f4f1fb 10px,#f4f1fb 20px);border:3px dashed #b9b0d8;border-radius:16px;display:grid;place-items:center;color:#7a6fa8;font-weight:800;text-align:center;padding:4px;aspect-ratio:1;min-width:0}
.pl span{font-size:clamp(11px,2vh,18px);line-height:1.1}
img.ph,.pl{width:100%;aspect-ratio:1}
img.ph{object-fit:cover;border-radius:16px;display:block}
#tip{padding:6px 16px;background:#fff9;font-size:14px;max-height:36vh;overflow:auto;display:none}
#tip ol{margin:4px 0 6px;padding-left:22px}#tip li{margin:2px 0}
#ro{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9}
#ro>div{background:#fff;border-radius:24px;padding:26px 36px;text-align:center;font-size:clamp(24px,5vw,40px);font-weight:800;max-width:90vw}
#ro small{display:block;font-size:18px;font-weight:700;margin:8px 0 14px;color:#666}
.star{display:inline-block;width:1em;height:1em;background:var(--sun);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);vertical-align:-.1em}
.qb{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(560px,100%)}
.qc{position:relative;aspect-ratio:1.25;border-radius:16px;border:5px solid var(--a);background:var(--bg2);color:var(--a);font-size:clamp(34px,7vh,60px);font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;padding:6px}
.qc u{position:absolute;top:3px;left:8px;font-size:13px;text-decoration:none;background:#fffc;border-radius:6px;padding:0 5px;color:var(--ink)}
.qc.dn{background:#e8f5e9;border-color:#9bd3ae;color:var(--ink);opacity:.65;font-size:clamp(13px,2.2vh,20px);line-height:1.2}
.qc.dn.on{background:#fff2a8;border-color:var(--red);opacity:1}
.qbig{font-size:clamp(26px,5vh,42px);font-weight:800;line-height:1.2}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:none}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pop .45s}
.row button.go{background:var(--a);color:#fff}.shake{animation:shake .35s}
.scene{position:relative;width:min(470px,46vw);height:min(100%,520px);display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.tree{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);width:62%;height:58%}
.tree i{position:absolute;left:50%;transform:translateX(-50%);background:#2e7d32;clip-path:polygon(50% 0,100% 100%,0 100%)}
.tree i:nth-child(1){top:0;width:50%;height:42%;background:#3a9a3f}.tree i:nth-child(2){top:25%;width:75%;height:42%;background:#2f8a34}.tree i:nth-child(3){top:50%;width:100%;height:50%;background:#277a2c}
.tree b{position:absolute;left:50%;top:-6%;transform:translateX(-50%);width:26px;height:26px;background:var(--sun);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.floor{position:absolute;left:0;right:0;bottom:0;height:26%;background:#fff;border-radius:50%/60% 60% 0 0;opacity:.85}
.gifts{position:relative;display:flex;gap:min(2.4vw,18px);align-items:flex-end;justify-content:center;margin-bottom:3%}
.g{position:relative;width:min(15vw,98px);aspect-ratio:1;border-radius:10px;cursor:pointer;box-shadow:0 5px 0 #0003;transition:transform .15s}
.g:hover{transform:translateY(-4px)}
.g::before{content:"";position:absolute;left:44%;width:12%;top:0;bottom:0;background:#ffd84a}
.g::after{content:"";position:absolute;top:44%;height:12%;left:0;right:0;background:#ffd84a}
.g u{position:absolute;z-index:2;left:50%;top:50%;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:#fff;text-decoration:none;display:grid;place-items:center;font-weight:800;font-size:18px}
.g.dn{opacity:.25;cursor:default;box-shadow:none}.g.dn:hover{transform:none}.g.on{transform:scale(1.12);outline:5px solid #fff}
.g1{background:#d23b3b}.g2{background:#2f6fd8}.g3{background:#8e44ad}.g4{background:#e67e22}
.gp{width:min(470px,100%);flex:none}
.big{width:min(30vh,250px)}.big .ph,.big.pl{width:100%}
.people{display:flex;gap:10px;justify-content:center;width:100%}
.pe{position:relative;width:clamp(60px,9vw,96px);cursor:pointer;border-radius:16px;border:4px solid transparent}
.pe.pick{border-color:var(--red)}
.pe .mini{position:absolute;right:-6px;bottom:-6px;width:42%;border:3px solid #fff;border-radius:10px;overflow:hidden;background:#fff;z-index:2}
.pe .mini .ph,.pe .mini .pl{border-radius:0;border:0}
.fb{font-size:clamp(16px,2.6vh,22px);font-weight:800;min-height:26px;color:var(--ok)}
.fb.silly{color:#e67e22}

.hg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(560px,calc((100vh - 130px)*1.0))}
.ht{position:relative;cursor:pointer;border-radius:16px;border:4px solid transparent}.ht.ok{border-color:var(--ok)}.ht.ok::after{content:"";position:absolute;right:6px;top:6px;width:20px;height:20px;border-radius:50%;background:var(--ok);border:3px solid #fff}

.fr{display:flex;align-items:center;justify-content:center;gap:8px;font-size:clamp(16px,2.8vh,24px);font-weight:800}
.slt{width:clamp(44px,8vh,64px);aspect-ratio:1;border-radius:12px;background:#f0ece4;border:3px dashed #c9b99a;display:grid;place-items:center;color:#b09a74;overflow:hidden}
.slt .ph,.slt .pl{border-radius:0;border:0}
.big{width:min(24vh,220px)}
.zbx{position:fixed;inset:0;background:#000b;z-index:20;display:flex;align-items:center;justify-content:center;cursor:pointer}
.zin{background:#fff;border-radius:18px;padding:12px;text-align:center}
.zin .ph,.zin .pl{width:min(72vh,80vw);max-width:760px;border-radius:12px}
.zt{margin-top:8px;font-weight:800;color:#666}

</style></head><body>

<main id="st"></main>

const LBL={"hat": "hat", "watch": "watch", "shirt": "shirt", "bone": "bone", "aunt": "aunt", "uncle": "uncle", "cousin": "cousin", "dog": "dog"};
function ph(k,c){return IMG[k]?'<img class="ph '+(c||'')+'" src="'+IMG[k]+'" alt="">':'<div class="pl '+(c||'')+'"><span>'+(LBL[k]||k)+'</span></div>'}
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const DUR=[180, 300, 240];
let cur=0,secs=0,iv=null;
function fmt(){$('#t').textContent=Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0');$('#t').classList.toggle('low',secs<=30)}
function tog(){if(iv){clearInterval(iv);iv=null;$('#tb').textContent='Start'}else{iv=setInterval(()=>{secs>0?(secs--,fmt()):tog()},1000);$('#tb').textContent='Pause'}}
function tgl(){const t=$('#tip');t.style.display=t.style.display=='block'?'none':'block'}
function say(h){$('#sy').innerHTML=h}
function fin(){celebrate('Merry Christmas!','Great speaking!')}
function celebrate(m,s){$('#rm').innerHTML=m;$('#rs').textContent=s||'';$('#ro').style.display='flex'}
function qcards(el,QS){
  const cells=QS.map(x=>({...x}));let last=-1;
  el.innerHTML='<div class="qb" id="qb"></div><div class="panel" id="qp" style="width:min(440px,100%);min-height:260px"><div class="qbig" id="qq">Tap a card!</div><div class="say" id="sy"></div><div class="row" id="qr"></div></div>';
  cells.forEach((c,i)=>{const d=document.createElement('div');d.className='qc';d.id='q'+i;d.innerHTML='<u>'+(i+1)+'</u>?';d.onclick=()=>{
    if(c.dn)return;c.dn=1;document.querySelectorAll('.qc').forEach(e=>e.classList.remove('on'));
    d.className='qc dn on pop';d.innerHTML='<u>'+(i+1)+'</u>'+c.q;
    $('#qq').textContent=c.q;say('');
    $('#qr').innerHTML='<button onclick="say(\'<span class=ans>'+c.h.replace(/'/g,"\\'")+'</span>\')">Hint</button><button onclick="say(\'<span class=ans>'+c.f.replace(/'/g,"\\'")+'</span>\')">Follow-up question</button>';
    if(cells.every(x=>x.dn))setTimeout(()=>celebrate('All cards open!','Great talking!'),700)};
    $('#qb').appendChild(d)});
}
const A=[];
function go(i){if(iv)tog();cur=i;secs=DUR[i];fmt();
  document.querySelectorAll('.tab').forEach((e,j)=>e.classList.toggle('on',j==i));
  $('#nx').style.display=i==A.length-1?'none':'';$('#fn').style.display=i==A.length-1?'':'none';
  $('#tt').innerHTML=A[i].tip;$('#h').textContent=A[i].h;$('#st').innerHTML='';A[i].run($('#st'))}
const ZB=['aunt','uncle','cousin'];
function zp(k,cb){const z=document.createElement('div');z.className='zbx';z.innerHTML='<div class="zin">'+ph(k)+'<div class="zt">Tap to close</div></div>';z.onclick=()=>{z.remove();cb&&cb()};document.body.appendChild(z)}
const W1=['hat','watch','shirt','bone','aunt','uncle','cousin','dog'];
let w1q=[],w1i=0,w1d={};
A.push({h:'1. Word Hunt',tip:'<ol><li>Say a word out loud: "Find the hat!" Press Show word only if you need to check the word.</li><li>Student taps the picture and says the word. Ask: "What is it?" Student: "It is a hat." / "It is my aunt."</li><li>Wrong tap = shake. Try again. Find all 8 words.</li></ol>',run:el=>{
 w1q=shuf(W1);w1i=0;w1d={};
 el.innerHTML='<div class="panel" style="width:min(150px,16vw)"><div class="say" style="font-size:16px">Find</div><div class="qbig" id="w1w" style="font-size:clamp(20px,3.6vh,30px);min-height:44px">?</div><button class="sm" onclick="$(\'#w1w\').textContent=w1q[w1i]">Show word</button><button onclick="w1n()" class="go" style="font-size:16px;padding:8px 12px">Next word</button><div class="say" id="sy" style="font-size:16px"></div></div><div class="hg" id="hg"></div>';
 const g=$('#hg');shuf(W1).forEach(k=>{const d=document.createElement('div');d.className='ht';d.id='h_'+k;d.innerHTML=ph(k);d.onclick=()=>ZB.includes(k)?zp(k,()=>w1t(k)):w1t(k);g.appendChild(d)})}});
function w1n(){if(w1i<7&&w1d[w1q[w1i]]){w1i++;$('#w1w').textContent='?';say('')}else say('Find this one first!')}
function w1t(k){if(w1d[k])return;if(k==w1q[w1i]){w1d[k]=1;$('#h_'+k).classList.add('ok','pop');say('<span class="ans">Say it: It is a '+k+'.</span>');if(Object.keys(w1d).length==8)setTimeout(()=>celebrate('All 8 words found!','Great hunting!'),700)}else{$('#h_'+k).classList.add('shake');setTimeout(()=>$('#h_'+k).classList.remove('shake'),400)}}

const IT=[['hat','aunt'],['watch','uncle'],['shirt','cousin'],['bone','dog']];
const PE=['aunt','uncle','cousin','dog'];
const GRP={hat:'There is a hat for my aunt.',watch:'There is a watch for my uncle.',shirt:'There is a shirt for my cousin.',bone:'There is a bone for their dog.'};
let gi=-1,delivered={};
A.push({h:'2. Unwrap the Gifts',tip:'<ol><li>Step 1: Student taps any gift box. Ask "What is it?" Student: "There is a hat." (the photo goes into the sentence frame)</li><li>Step 2: Ask "Who is it for?" Student taps ONE person (any person is OK!) and adds: "...for my aunt." Then say the whole sentence: "There is a hat for my aunt."</li><li>Hint gives 3 steps: first part, then most of the sentence, then the full sentence. Tap aunt, uncle, cousin to see a big photo.</li><li>If it is like the story you see "Like the story!". If not, it is "Silly!" - laugh and let the student say it again.</li><li>Press Show answer only to check. Wrap up all 4 gifts to say Merry Christmas.</li></ol>',run:el=>{
 gi=-1;delivered={};
 el.innerHTML='<div class="scene"><div class="tree"><i></i><i></i><i></i><b></b></div><div class="floor"></div><div class="gifts" id="gf"></div></div>'+
 '<div class="panel gp"><div class="big" id="bg"></div><div class="fr"><span>There is a</span><div class="slt" id="s1">?</div><span>for my</span><div class="slt" id="s2">?</div></div><div class="say" id="sy">Tap a gift!</div><div class="people" id="pp"></div><div class="fb" id="fb"></div><div class="row"><button onclick="hintG()">Hint</button></div></div>';
 IT.forEach((x,i)=>{const d=document.createElement('div');d.className='g g'+(i+1);d.id='g'+i;d.innerHTML='<u>'+(i+1)+'</u>';d.onclick=()=>openG(i);$('#gf').appendChild(d)});
 PE.forEach(p=>{const d=document.createElement('div');d.className='pe';d.id='p_'+p;d.innerHTML=ph(p)+'<div class="mini" id="m_'+p+'" style="display:none"></div>';d.onclick=()=>{if(gi<0)return;ZB.includes(p)?zp(p,()=>give(p)):give(p)};$('#pp').appendChild(d)});
}});
function openG(i){if(delivered[IT[i][0]])return;if(gi>=0&&!delivered[IT[gi][0]]){$('#g'+gi).classList.remove('on')}
 gi=i;$('#g'+i).classList.add('on');$('#bg').innerHTML=ph(IT[i][0]);$('#bg').classList.add('pop');setTimeout(()=>$('#bg').classList.remove('pop'),500);
 hs=0;$('#s1').innerHTML=ph(IT[i][0]);$('#s2').textContent='?';$('#fb').textContent='';$('#fb').className='fb';say('Step 1: What is it?');document.querySelectorAll('.pe').forEach(e=>e.classList.remove('pick'))}
let hs=0;
function hintG(){if(gi<0){say('Tap a gift first!');return}hs=Math.min(hs+1,3);const it=IT[gi][0];say('<span class="ans">'+[0,'There is a ___.','There is a '+it+' for ___.',GRP[it]][hs]+'</span>')}
function give(p){if(gi<0)return;const it=IT[gi][0];if(delivered[it])return;
 document.querySelectorAll('.pe').forEach(e=>e.classList.remove('pick'));$('#p_'+p).classList.add('pick');
 const ok=IT[gi][1]==p;const fb=$('#fb');$('#s2').innerHTML=ph(p);hs=0;say('Step 2: Say the whole sentence!');
 if(ok){fb.textContent='Like the story!';fb.className='fb';delivered[it]=p;$('#g'+gi).classList.remove('on');$('#g'+gi).classList.add('dn');
  const m=$('#m_'+p);m.style.display='block';m.innerHTML=ph(it);
  if(Object.keys(delivered).length==4)setTimeout(()=>celebrate('Merry Christmas!','All the gifts are ready!'),600)}
 else{fb.textContent='Silly! Say it, then try again.';fb.className='fb silly';$('#p_'+p).classList.add('shake');setTimeout(()=>$('#p_'+p).classList.remove('shake'),400)}}
A.push({h:'3. Tell Me About You',tip:'<ol><li>Tap any card to open a question.</li><li>Student answers about their own life. Teacher models first on teacher turns.</li><li>Stuck? Press Hint (sentence starter). Press Follow-up question to keep talking.</li></ol>',run:el=>qcards(el,[
 {q:'What gift do you want?',h:'I want a ___.',f:'Why do you want it?'},
 {q:'Who do you give a gift to?',h:'I give a gift to my ___.',f:'What is the gift?'},
 {q:'What is a good gift for your mom or dad?',h:'A ___ is a good gift.',f:'Does he or she like it?'},
 {q:'What is a good gift for a dog?',h:'There is a ___ for the dog.',f:'What does the dog like to do?'},
 {q:'What is under your tree?',h:'There is a ___ for ___.',f:'How many gifts are there?'},
 {q:'Do you like surprises?',h:'Yes, I do. / No, I don’t.',f:'What is a good surprise?'}])});

A.forEach((a,i)=>{const d=document.createElement('div');d.className='tab';d.textContent='Mission '+(i+1);d.onclick=()=>go(i);$('#tabs').appendChild(d)});
go(0);
</script></body></html>
