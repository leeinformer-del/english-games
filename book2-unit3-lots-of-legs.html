<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mystery Animal – Lots of Legs</title>
<style>
:root{--ink:#2b2a3a;--a:#00796b;--b:#ff7043;--sun:#ffd84a;--bg1:#e0f7f1;--bg2:#b8e6d9;--red:#ff5c5c;--ok:#2fb86a;box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Baloo 2","Comic Sans MS","Chalkboard SE",system-ui,sans-serif;background:linear-gradient(var(--bg1),var(--bg2));color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:8px;padding:6px 14px;flex-wrap:wrap}
.tab{padding:5px 14px;border-radius:99px;background:#fff9;font-weight:700;font-size:15px;cursor:pointer}
.tab.on{background:var(--a);color:#fff}
#h{flex:1;font-size:clamp(17px,2.6vw,26px);font-weight:800;min-width:150px}
#t{font-size:28px;font-weight:800;background:#fff;border-radius:14px;padding:0 12px;min-width:86px;text-align:center}
#t.low{background:var(--red);color:#fff}
button{font:inherit;font-weight:800;border:0;border-radius:14px;padding:8px 16px;background:var(--sun);color:var(--ink);cursor:pointer}
button.sm{background:#fff;padding:6px 12px;font-size:15px;opacity:.85}
button.go{background:var(--a);color:#fff;font-size:20px;padding:10px 24px}
button:disabled{opacity:.4;cursor:default}
main{flex:1;min-height:0;display:flex;gap:14px;align-items:center;justify-content:center;padding:4px 14px 8px}
.panel{background:#fff;border-radius:22px;padding:12px 16px;box-shadow:0 6px 0 #0002;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.say{font-size:clamp(18px,2.8vh,26px);font-weight:800;min-height:30px}
.ans{color:#c0392b}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.row button{background:#ffe9a8;font-size:15px}
.pl{background:repeating-linear-gradient(45deg,#e9e4f5,#e9e4f5 10px,#f4f1fb 10px,#f4f1fb 20px);border:3px dashed #b9b0d8;border-radius:16px;display:grid;place-items:center;color:#7a6fa8;font-weight:800;text-align:center;padding:4px;aspect-ratio:1;min-width:0}
.pl span{font-size:clamp(11px,2vh,18px);line-height:1.1}
img.ph,.pl{width:100%;aspect-ratio:1}
img.ph{object-fit:cover;border-radius:16px;display:block}
#tip{padding:6px 16px;background:#fff9;font-size:14px;max-height:36vh;overflow:auto;display:none}
#tip ol{margin:4px 0 6px;padding-left:22px}#tip li{margin:2px 0}
#ro{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9}
#ro>div{background:#fff;border-radius:24px;padding:26px 36px;text-align:center;font-size:clamp(24px,5vw,40px);font-weight:800;max-width:90vw}
#ro small{display:block;font-size:18px;font-weight:700;margin:8px 0 14px;color:#666}
.star{display:inline-block;width:1em;height:1em;background:var(--sun);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);vertical-align:-.1em}
.qb{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(560px,100%)}
.qc{position:relative;aspect-ratio:1.25;border-radius:16px;border:5px solid var(--a);background:var(--bg2);color:var(--a);font-size:clamp(34px,7vh,60px);font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;padding:6px}
.qc u{position:absolute;top:3px;left:8px;font-size:13px;text-decoration:none;background:#fffc;border-radius:6px;padding:0 5px;color:var(--ink)}
.qc.dn{background:#e8f5e9;border-color:#9bd3ae;color:var(--ink);opacity:.65;font-size:clamp(13px,2.2vh,20px);line-height:1.2}
.qc.dn.on{background:#fff2a8;border-color:var(--red);opacity:1}
.qbig{font-size:clamp(26px,5vh,42px);font-weight:800;line-height:1.2}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:none}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pop .45s}
.row button.go{background:var(--a);color:#fff}.shake{animation:shake .35s}
.mys{position:relative;width:min(34vh,300px);aspect-ratio:1;overflow:hidden;border-radius:18px;background:#fff}
.mys .ph,.mys .pl{width:100%;height:100%;border-radius:0;transition:filter .6s}
.mys .qm{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(60px,14vh,120px);font-weight:800;color:#fff;text-shadow:0 3px 0 #0006;pointer-events:none}
.legs{display:flex;gap:6px;justify-content:center;min-height:30px;flex-wrap:wrap;max-width:300px}
.legs i{width:14px;height:30px;border-radius:7px;background:#5d4037}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(330px,100%)}
.op{cursor:pointer;border-radius:14px;border:4px solid transparent}
.op.on{border-color:var(--red)}.op.dn{opacity:.3;pointer-events:none}
.vs{display:flex;gap:16px;align-items:center;justify-content:center}
.vs .pic{width:min(24vh,230px)}
.vs b{font-size:clamp(28px,6vh,54px);color:var(--b)}
.vs .legs{max-width:230px}

.mg3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(560px,calc((100vh - 130px)*1.45))}
.w3{position:relative}.w3 .cover{position:absolute;inset:0;border-radius:16px;background:var(--a);color:#fff;display:none;place-items:center;font-size:clamp(34px,8vh,64px);font-weight:800;border:4px solid #fff}
.w3.hid .cover{display:grid}

#t,#tb{display:none!important}
.frame{font-size:clamp(20px,3.6vh,30px);font-weight:700;text-align:center;line-height:1.35;color:var(--a)}
.frame b{display:inline-block;min-width:3.2em;border-bottom:3px solid var(--b);color:#bbb;padding:0 4px}
.frame b.on{color:var(--b);border-color:transparent}
.opts4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.dcard{background:#fff;border:3px dashed var(--b);border-radius:18px;padding:10px 14px;text-align:center;width:min(320px,100%);margin:0 auto}
.dcard .dt{font-weight:800;color:var(--a);font-size:clamp(16px,2.6vh,22px)}
.dph{width:min(22vh,190px);margin:6px auto}.dph .ph,.dph .pl{width:100%}
.dq{aspect-ratio:1;display:grid;place-items:center;font-size:64px;font-weight:800;color:#ccc}
.dl{font-size:clamp(18px,3vh,26px);font-weight:700}.dl b{color:var(--b)}

.pip{display:inline-block;width:11px;height:11px;border-radius:50%;border:2px solid var(--a);margin-right:4px;vertical-align:-1px}.pip.on{background:var(--b);border-color:var(--b)}
button:disabled{opacity:.55;cursor:default}

</style></head><body>

  cells.forEach((c,i)=>{const d=document.createElement('div');d.className='qc';d.id='q'+i;d.innerHTML='<u>'+(i+1)+'</u>?';d.onclick=()=>{
    if(c.dn)return;c.dn=1;document.querySelectorAll('.qc').forEach(e=>e.classList.remove('on'));
    d.className='qc dn on pop';d.innerHTML='<u>'+(i+1)+'</u>'+c.q;
    $('#qq').textContent=c.q;say('');
    $('#qr').innerHTML='<button onclick="say(\'<span class=ans>'+c.h.replace(/'/g,"\\'")+'</span>\')">Hint</button><button onclick="say(\'<span class=ans>'+c.f.replace(/'/g,"\\'")+'</span>\')">Follow-up question</button>';
    if(cells.every(x=>x.dn))setTimeout(()=>celebrate('All cards open!','Great talking!'),700)};
    $('#qb').appendChild(d)});
}
const A=[];
function go(i){if(iv)tog();cur=i;secs=DUR[i];fmt();
  document.querySelectorAll('.tab').forEach((e,j)=>e.classList.toggle('on',j==i));
  $('#nx').style.display=i==A.length-1?'none':'';$('#fn').style.display=i==A.length-1?'':'none';
  $('#tt').innerHTML=A[i].tip;$('#h').textContent=A[i].h;$('#st').innerHTML='';A[i].run($('#st'))}
const W3=['bird','horse','bee','spider','crab','fish'];
let w3h=[],w3r=0;
A.push({h:'1. Who’s Missing?',tip:'<ol><li>Student looks at all 6 animals and says each word.</li><li>Press Hide. Student closes their eyes (or looks away). One animal disappears!</li><li>Student looks and says: "The bee is missing!" Press Show to check.</li><li>Press Hide two later for a harder round.</li></ol>',run:el=>{
 w3h=[];w3r=0;
 el.innerHTML='<div class="mg3" id="mg3"></div><div class="panel" style="width:min(250px,24vw)"><div class="say" id="sy">Say all the animals!</div><div class="row"><button class="go" onclick="w3hide(1)">Hide</button><button onclick="w3hide(2)">Hide two</button></div><div class="row"><button onclick="w3show()">Show</button><button onclick="say(\'<span class=ans>The ___ is missing!</span>\')">Hint</button></div><div class="say" style="font-size:15px">Round <span id="w3n">0</span> / 5</div></div>';
 W3.forEach(k=>{const d=document.createElement('div');d.className='w3';d.id='w_'+k;d.innerHTML=ph(k)+'<div class="cover">?</div>';$('#mg3').appendChild(d)})}});
function w3hide(n){w3show(true);const a=shuf(W3).slice(0,n);w3h=a;a.forEach(k=>$('#w_'+k).classList.add('hid'));say(n==1?'Which animal is missing?':'Which two are missing?');w3r++;$('#w3n').textContent=Math.min(w3r,5)}
function w3show(q){if(!w3h.length&&!q)return;const ws=w3h.slice();document.querySelectorAll('.w3').forEach(e=>e.classList.remove('hid'));if(!q&&ws.length){say('<span class="ans">'+ws.map(k=>'The '+k).join(' and the ')+(ws.length>1?' are':' is')+' missing!</span>');ws.forEach(k=>$('#w_'+k).classList.add('pop'));if(w3r>=5)setTimeout(()=>celebrate('Great eyes!','You found the missing animals!'),900)}w3h=q?[]:w3h}

const LG={bird:2,horse:4,bee:6,spider:8,crab:10,fish:0};
const LK=Object.keys(LG);
const PL={bird:'A bird',horse:'A horse',bee:'A bee',spider:'A spider',crab:'A crab',fish:'A fish'};
function legsH(n){return n==0?'<span class="ans">No legs!</span>':Array.from({length:n},()=>'<i></i>').join('')}
let order=[],ri=0,cl=0,tgt='',solved=false;
A.push({h:'2. Mystery Animal',tip:'<ol><li>A blurry animal is hidden. Student guesses by tapping one animal photo below and says: "Is it a spider?"</li><li>There are 2 clues. Clue 1 makes the photo clearer. Clue 2 shows the legs and fills the first blank: "It has ___ legs." Student reads it.</li><li>Right guess fills the second blank: "It is a ___." Student says the whole sentence: "A spider has eight legs."</li><li>Next animal: 6 animals in all.</li></ol>',run:el=>{
 order=shuf(LK);ri=0;newR(el)}});
function newR(el){el=el||$('#st');cl=0;solved=false;tgt=order[ri];
 el.innerHTML='<div class="panel" style="width:min(380px,100%)"><div class="mys" id="my">'+ph(tgt)+'<div class="qm" id="qm">?</div></div><div class="legs" id="lg"></div><div class="frame"><div>It has <b id="s1">___</b> legs.</div><div>It is a <b id="s2">___</b>.</div></div><div class="say" id="sy">What is it?</div><div class="row"><button id="cb" onclick="clue()"></button><button onclick="say(\'<span class=ans>Is it a ___?</span>\')">Hint</button><button id="nb" onclick="nextR()" style="display:none">Next animal</button></div></div><div class="panel" style="width:min(380px,100%)"><div class="opts" id="op"></div><div class="say" style="font-size:16px;min-height:0">Round <span id="rr">'+(ri+1)+'</span> of 6</div></div>';
 LK.forEach(k=>{const d=document.createElement('div');d.className='op';d.id='o_'+k;d.innerHTML=ph(k);d.onclick=()=>guess(k);$('#op').appendChild(d)});
 setBlur();cbl()}
const NW=['no','one','two','three','four','five','six','seven','eight','nine','ten'];
function fill(id,t){const e=$('#'+id);e.textContent=t;e.classList.add('on')}
function setBlur(){const im=$('#my').firstChild;im.style.filter=solved?'none':'blur('+[34,22,12][Math.min(cl,2)]+'px)'}
function cbl(){const b=$('#cb');if(!b)return;b.innerHTML=cl>=2?'<span class="pip on"></span><span class="pip on"></span> No more clues':'<span class="pip'+(cl>=1?' on':'')+'"></span><span class="pip"></span> Clue '+(cl+1)+' of 2';b.disabled=cl>=2||solved}
function clue(){if(solved||cl>=2)return;cl++;if(cl>=2){$('#lg').innerHTML=legsH(LG[tgt]);fill('s1',NW[LG[tgt]])}setBlur();say(cl==1?'Clue 1 of 2: Look! A little clearer.':'Clue 2 of 2: It has this many legs!');cbl()}
function guess(k){if(solved)return;
 if(k==tgt){solved=true;$('#qm').style.display='none';setBlur();$('#lg').innerHTML=legsH(LG[tgt]);fill('s1',NW[LG[tgt]]);fill('s2',tgt);$('#o_'+k).classList.add('on');say('<span class="ans">'+PL[tgt]+' has '+(LG[tgt]||'no')+' legs.</span>');
  $('#cb').style.display='none';
  if(ri<5){$('#nb').style.display=''}else setTimeout(()=>celebrate('All 6 solved!','You are a great detective!'),800)}
 else{$('#o_'+k).classList.add('dn');$('#o_'+k).classList.add('shake');say('Not '+PL[k].toLowerCase()+'. Try again!')}}
function nextR(){ri++;newR()}

const PETS={bird:2,horse:4,bee:6,spider:8,crab:10,fish:0,dog:4,rabbit:4};
const PK=Object.keys(PETS);
const DO={bird:'feed',horse:'walk',bee:'watch',spider:'watch',crab:'watch',fish:'feed',dog:'walk',rabbit:'play'};
const SL={bird:'in a cage',horse:'in a barn',bee:'in a hive',spider:'in a web',crab:'in a tank',fish:'in a tank',dog:'on my bed',rabbit:'in a cage'};
const EA={bird:'seeds',horse:'grass',bee:'flowers',spider:'bugs',crab:'small fish',fish:'fish food',dog:'dog food',rabbit:'carrots'};
const MQ=p=>[
 {q:'How many legs does it have?',h:'It has ___ legs.',a:'It has '+NW[PETS[p]]+' legs.'},
 {q:'What will you do with your '+p+'?',h:'I will ___ with my '+p+'. (play / walk / feed / watch)',a:'I will '+DO[p]+' with my '+p+'.'},
 {q:'Where will your '+p+' sleep?',h:'It will sleep ___. (in my room / '+SL[p]+')',a:'It will sleep '+SL[p]+'.'},
 {q:'What will your '+p+' eat?',h:'It will eat ___. ('+EA[p]+' ...)',a:'It will eat '+EA[p]+'.'},
 {q:'What is its name?',h:'Its name is ___. (Lucky / Coco / Max)',a:'Its name is Lucky.'}];
let mp='',mi=0,mshow=false;
A.push({h:'3. My Dream Pet',tip:'<ol><li>Ask: "What pet do you want?" Student taps one photo and says: "I want a spider."</li><li>The Dream Pet card fills in. Press Next question to ask 5 questions in order (Question 1 of 5 … 5 of 5). They are all about the student’s dream pet.</li><li>Hint = sentence starter. Check = sample answer for that question (question 1 also shows the legs on the card).</li><li>After the last question, press Finish card. Student reads: "My dream pet is a ___. It has ___ legs."</li></ol>',run:el=>{mp='';mi=0;mshow=false;dream(el)}});
function dream(el){el=el||$('#st');
 el.innerHTML='<div class="panel" style="width:min(340px,100%)"><div class="say" style="min-height:0;font-size:18px">Tap your dream pet!</div><div class="opts4" id="pp"></div></div><div class="panel" style="width:min(400px,100%)"><div class="dcard" id="dc"><div class="dt">My Dream Pet</div><div class="dph" id="dp"><div class="dq">?</div></div><div class="dl" id="d1">I want a ___.</div><div class="dl" id="d2">It has ___ legs.</div><div class="legs" id="dg" style="min-height:0"></div></div><div class="say" id="sy">What pet do you want?</div><div class="row"><button onclick="dhint()">Hint</button><button onclick="dcheck()">Check</button><button class="go" id="nq" onclick="dnext()">Next question</button></div></div>';
 PK.forEach(k=>{const d=document.createElement('div');d.className='op';d.id='p_'+k;d.innerHTML=ph(k);d.onclick=()=>dpick(k);$('#pp').appendChild(d)})}
function dpick(k){mp=k;mi=0;mshow=false;document.querySelectorAll('#pp .op').forEach(e=>e.classList.remove('on'));$('#p_'+k).classList.add('on');nbl();
 $('#dp').innerHTML=ph(k);$('#d1').innerHTML='I want a <b>'+k+'</b>.';$('#d2').innerHTML='It has ___ legs.';$('#dg').innerHTML='';
 say('<span class="ans">I want a '+k+'.</span>');setTimeout(()=>{if(mp==k)say(qt())},1600)}
function qt(){return 'Question '+(mi+1)+' of '+MQ(mp).length+': '+MQ(mp)[mi].q}
function nbl(){const b=$('#nq');if(b)b.textContent=(mp&&mi>=MQ(mp).length-1)?'Finish card':'Next question'}
function dhint(){if(!mp){say('<span class="ans">I want a ___.</span>');return}say('<span class="ans">'+MQ(mp)[mi].h+'</span>')}
function dcheck(){if(!mp)return;const a=MQ(mp)[mi].a;if(mi==0){const n=PETS[mp];$('#dg').innerHTML=legsH(n);$('#dg').style.minHeight='30px';$('#d2').innerHTML='It has <b>'+NW[n]+'</b> legs.'}say('<span class="ans">'+a+'</span>')}
function dnext(){if(!mp){say('Tap a dream pet first!');return}
 if(mi>=MQ(mp).length-1){celebrate('My Dream Pet!','My dream pet is a '+mp+'. It has '+NW[PETS[mp]]+' legs.');return}
 mi++;say(qt());nbl()}

A.forEach((a,i)=>{const d=document.createElement('div');d.className='tab';d.textContent='Mission '+(i+1);d.onclick=()=>go(i);$('#tabs').appendChild(d)});
go(0);
</script></body></html>
