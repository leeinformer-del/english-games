<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crack the Code – Animal Numbers</title>
<style>
:root{--ink:#2b2a3a;--a:#2c3e8f;--b:#f39c12;--sun:#ffd84a;--bg1:#e3e9ff;--bg2:#c5d0f5;--red:#ff5c5c;--ok:#2fb86a;box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Baloo 2","Comic Sans MS","Chalkboard SE",system-ui,sans-serif;background:linear-gradient(var(--bg1),var(--bg2));color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:8px;padding:6px 14px;flex-wrap:wrap}
.tab{padding:5px 14px;border-radius:99px;background:#fff9;font-weight:700;font-size:15px;cursor:pointer}
.tab.on{background:var(--a);color:#fff}
#h{flex:1;font-size:clamp(17px,2.6vw,26px);font-weight:800;min-width:150px}
#t{font-size:28px;font-weight:800;background:#fff;border-radius:14px;padding:0 12px;min-width:86px;text-align:center}
#t.low{background:var(--red);color:#fff}
button{font:inherit;font-weight:800;border:0;border-radius:14px;padding:8px 16px;background:var(--sun);color:var(--ink);cursor:pointer}
button.sm{background:#fff;padding:6px 12px;font-size:15px;opacity:.85}
button.go{background:var(--a);color:#fff;font-size:20px;padding:10px 24px}
button:disabled{opacity:.4;cursor:default}
main{flex:1;min-height:0;display:flex;gap:14px;align-items:center;justify-content:center;padding:4px 14px 8px}
.panel{background:#fff;border-radius:22px;padding:12px 16px;box-shadow:0 6px 0 #0002;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.say{font-size:clamp(18px,2.8vh,26px);font-weight:800;min-height:30px}
.ans{color:#c0392b}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.row button{background:#ffe9a8;font-size:15px}
.pl{background:repeating-linear-gradient(45deg,#e9e4f5,#e9e4f5 10px,#f4f1fb 10px,#f4f1fb 20px);border:3px dashed #b9b0d8;border-radius:16px;display:grid;place-items:center;color:#7a6fa8;font-weight:800;text-align:center;padding:4px;aspect-ratio:1;min-width:0}
.pl span{font-size:clamp(11px,2vh,18px);line-height:1.1}
img.ph,.pl{width:100%;aspect-ratio:1}
img.ph{object-fit:cover;border-radius:16px;display:block}
#tip{padding:6px 16px;background:#fff9;font-size:14px;max-height:36vh;overflow:auto;display:none}
#tip ol{margin:4px 0 6px;padding-left:22px}#tip li{margin:2px 0}
#ro{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9}
#ro>div{background:#fff;border-radius:24px;padding:26px 36px;text-align:center;font-size:clamp(24px,5vw,40px);font-weight:800;max-width:90vw}
#ro small{display:block;font-size:18px;font-weight:700;margin:8px 0 14px;color:#666}
.star{display:inline-block;width:1em;height:1em;background:var(--sun);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);vertical-align:-.1em}
.qb{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(560px,100%)}
.qc{position:relative;aspect-ratio:1.25;border-radius:16px;border:5px solid var(--a);background:var(--bg2);color:var(--a);font-size:clamp(34px,7vh,60px);font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;padding:6px}
.qc u{position:absolute;top:3px;left:8px;font-size:13px;text-decoration:none;background:#fffc;border-radius:6px;padding:0 5px;color:var(--ink)}
.qc.dn{background:#e8f5e9;border-color:#9bd3ae;color:var(--ink);opacity:.65;font-size:clamp(13px,2.2vh,20px);line-height:1.2}
.qc.dn.on{background:#fff2a8;border-color:var(--red);opacity:1}
.qbig{font-size:clamp(26px,5vh,42px);font-weight:800;line-height:1.2}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:none}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pop .45s}
.row button.go{background:var(--a);color:#fff}.shake{animation:shake .35s}
.safe{background:#4a5568;border:8px solid #2d3748;border-radius:22px;padding:14px 16px;display:flex;flex-direction:column;align-items:center;gap:8px;box-shadow:0 8px 0 #0004;width:min(330px,34vw)}
.safe h3{margin:0;color:#fff;font-size:clamp(15px,2.4vh,20px)}
.lk{display:flex;gap:6px}
.dg{width:clamp(36px,5vw,52px);height:clamp(48px,7vh,68px);background:#111;color:#7CFC8A;border-radius:8px;display:grid;place-items:center;font-size:clamp(26px,4.4vh,40px);font-weight:800}
.dg.cur{outline:4px solid var(--sun)}
.tgt{font-size:clamp(16px,2.6vh,22px);color:#fff;font-weight:800}
.tgt b{display:inline-block;background:var(--sun);color:var(--ink);border-radius:12px;padding:0 14px;font-size:clamp(34px,7vh,60px);margin-left:6px}
.zoo{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(480px,100%)}
.an{position:relative;cursor:pointer;border-radius:16px;border:4px solid transparent}
.an.on{border-color:var(--red)}
.an .nm{position:absolute;right:6px;top:6px;background:var(--sun);color:var(--ink);font-weight:800;font-size:clamp(22px,4vh,34px);border-radius:12px;padding:0 10px;display:none}
.an.on .nm{display:block}
.an.mid{grid-column:auto}
.sp{min-width:min(330px,34vw)}

.mg{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;width:min(620px,calc((100vh - 120px)*1.3))}
.mc{position:relative;aspect-ratio:1;cursor:pointer;perspective:600px}
.mf,.mb{position:absolute;inset:0;border-radius:16px;backface-visibility:hidden;transition:transform .45s;display:grid;place-items:center}
.mf{background:var(--a);color:#fff;font-size:clamp(30px,7vh,56px);font-weight:800;border:4px solid #fff}
.mb{transform:rotateY(180deg);overflow:hidden}.mb .ph,.mb .pl{height:100%;border-radius:0}
.mc.fl .mf{transform:rotateY(180deg)}.mc.fl .mb{transform:none}
.mc.mt .mb{outline:5px solid var(--ok);border-radius:16px}

.dts{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-top:6px;max-width:200px}.dts i{width:12px;height:12px;border-radius:50%;background:var(--sun)}.dts i.z{background:none;border:3px solid var(--sun)}
.tgt{text-align:center}

.rw{position:relative;width:min(33vh,300px);aspect-ratio:1}
.rw .ph,.rw .pl{width:100%;height:100%}
.ring{position:absolute;border:5px solid #ff3b5c;border-radius:50%;box-shadow:0 0 0 3px #fff8,0 0 18px #ff3b5c88;animation:rg 1.2s ease-in-out infinite;pointer-events:none}
@keyframes rg{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;width:100%}
.key{font-size:clamp(20px,3.6vh,30px);padding:6px 0;background:#ffe9a8}.key.okk{background:#2fb86a;color:#fff}
.dg.sm{width:clamp(24px,2.6vw,36px);height:clamp(36px,5.6vh,48px);font-size:clamp(18px,3.2vh,28px)}
.lk:has(.sm){gap:4px;flex-wrap:nowrap}
.lk{flex-wrap:wrap;justify-content:center}
.chest{position:relative;width:130px;height:84px;margin:0 auto}
.chest .bx{position:absolute;left:0;right:0;bottom:0;height:52px;background:#8d5524;border:4px solid #5d3a12;border-radius:6px;overflow:hidden}
.chest .bx i{position:absolute;left:50%;top:6px;width:18px;height:22px;margin-left:-9px;background:#ffd84a;border-radius:4px;border:2px solid #b8860b}
.chest .lid{position:absolute;left:-2px;right:-2px;bottom:44px;height:34px;background:#a8672d;border:4px solid #5d3a12;border-radius:40px 40px 4px 4px;transform-origin:50% 100%;transition:transform .8s}
.chest.open .lid{transform:translate(-8px,-22px) rotate(-16deg)}
.chest.open .bx{background:#ffd84a;box-shadow:0 0 30px #ffd84a}
.chest.open .bx i{display:none}
.coins i{position:absolute;bottom:50px;width:14px;height:14px;border-radius:50%;background:#ffd84a;border:2px solid #b8860b;opacity:0;animation:cn 1.2s ease-out forwards}
@keyframes cn{0%{transform:translateY(0);opacity:1}100%{transform:translateY(-60px);opacity:0}}
.z8{grid-template-columns:repeat(4,1fr);width:min(520px,100%)}

.dn{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.dn text{font-family:"Baloo 2","Arial Rounded MT Bold",Arial,sans-serif;font-weight:900}
.dn .t1{fill:none;stroke:rgba(255,255,255,.5);stroke-linecap:round;stroke-linejoin:round}
.dn .t2{fill:none;stroke:rgba(255,60,85,.4);stroke-linecap:round;stroke-linejoin:round}

#t,#tb{display:none!important}

.bigq{display:flex;align-items:center;justify-content:center;text-align:center;width:min(33vh,300px);min-height:min(33vh,300px);font-size:clamp(24px,4.6vh,38px);font-weight:800;color:var(--a);background:#eef1ff;border-radius:16px;padding:14px}
.big3{width:100%;height:100%;display:grid;place-items:center;font-size:clamp(80px,18vh,160px);font-weight:900;background:#fff4d1;border-radius:16px;color:#f39c12}
#lp3{min-height:min(61vh,400px)}

</style></head><body>

function qcards(el,QS){
  const cells=QS.map(x=>({...x}));let last=-1;

  cells.forEach((c,i)=>{const d=document.createElement('div');d.className='qc';d.id='q'+i;d.innerHTML='<u>'+(i+1)+'</u>?';d.onclick=()=>{
    if(c.dn)return;c.dn=1;document.querySelectorAll('.qc').forEach(e=>e.classList.remove('on'));
    d.className='qc dn on pop';d.innerHTML='<u>'+(i+1)+'</u>'+c.q;
    $('#qq').textContent=c.q;say('');
    $('#qr').innerHTML='<button onclick="say(\'<span class=ans>'+c.h.replace(/'/g,"\\'")+'</span>\')">Hint</button><button onclick="say(\'<span class=ans>'+c.f.replace(/'/g,"\\'")+'</span>\')">Follow-up question</button>';

}

const W2=['mouse','elephant','snake','monkey','bug'];

 w2c=shuf(W2.concat(W2));w2f=[];w2m=0;w2lock=false;
 el.innerHTML='<div class="mg" id="mg"></div><div class="panel" style="width:min(220px,22vw)"><div class="say" id="sy">Flip two cards!</div><div class="say">Pairs: <span id="w2n">0</span> / 5</div></div>';
 w2c.forEach((k,i)=>{const d=document.createElement('div');d.className='mc';d.id='m'+i;d.innerHTML='<div class="mf">?</div><div class="mb">'+ph(k)+'</div>';d.onclick=()=>w2t(i);$('#mg').appendChild(d)})}});
function w2t(i){if(w2lock||w2f.includes(i)||$('#m'+i).classList.contains('mt'))return;$('#m'+i).classList.add('fl');w2f.push(i);say('');
 if(w2f.length==2){const [a,b]=w2f;if(w2c[a]==w2c[b]){$('#m'+a).classList.add('mt');$('#m'+b).classList.add('mt');w2m++;$('#w2n').textContent=w2m;say('<span class="ans">Match! It is a '+w2c[a]+'.</span>');w2f=[];if(w2m==5)setTimeout(()=>celebrate('All pairs found!','Great memory!'),700)}

const IT2=[
 {k:'mouse',part:'body',n:6,sw:3.8,d:'M76,18 C60,8 38,10 28,36 C24,48 24,56 27,62 C30,78 52,86 62,76 C72,64 60,46 46,46 C36,46 28,54 27,64'},

 {k:'monkey',part:'tail',n:9,sw:3.8,d:'M91,32 C91,16 68,14 66,30 C65,43 82,47 90,38 C93,56 90,70 76,80 C72,82 66,83 62,83'},
 {k:'bug',part:'body',n:0,sw:3.8,d:'M43,28 C55,28 63,36 63,44 C63,53 54,58 43,58 C31,58 23,52 23,44 C23,35 31,28 43,28Z'},
 {k:'swan',part:'neck',n:2,sw:3.8,d:'M17,31 C20,20 40,18 40,34 C40,50 26,58 17,70 L50,72'},
 {k:'giraffe',part:'neck',n:1,sw:3.8,d:'M34,30 L45,24 L48,74'},
 {k:'seahorse',part:'body',n:5,sw:3.8,d:'M66,14 L46,14 C42,24 40,34 44,46 C58,40 72,52 66,66 C60,78 48,84 40,76'}];
const NW=['zero','one','two','three','four','five','six','seven','eight','nine'];
const art=n=>n==8?'an ':'a ';
function S2(it,l,part){const w=NW[it.n],P=it.part,K=it.k;
 if(l==1)return part==0?'___, ___.':part==1?P+', ___.':P+', '+w+'.';
 if(l==2)return part==0?'The ___ makes a ___.':part==1?'The '+P+' makes a ___.':'The '+P+' makes '+art(it.n)+w+'.';
 return part==0?'The ___’s ___ makes a ___.':part==1?'The '+K+'’s '+P+' makes ___.':'The '+K+'’s '+P+' makes '+art(it.n)+w+'.'}
const LT=['','Say: part + number','Say: The ___ makes a ___.','Say the story sentence!'];
let q2=[],qi=0,hh=0,cd=[],open2=false;
function lv(){return 2}
A.push({h:'2. Find the Treasure Code',tip:'<ol><li>Look at the photo. One animal body part looks like a number. Ask: "What does the body part make?"</li><li>Student says what they see. Student answers with the sentence "The ___ makes a ___." (example: "The body makes a six.")</li><li>The student taps the number on the keypad. The right number goes into the treasure code.</li><li>Hint has 2 steps. Show answer gives the full sentence. Find all 8 numbers to open the treasure chest!</li></ol>',run:el=>{
 q2=shuf(IT2);qi=0;cd=[];open2=false;
 el.innerHTML='<div class="panel" style="width:min(380px,100%)"><div class="rw" id="rw"></div><div class="say" id="lt" style="font-size:15px;color:#2c3e8f;min-height:0"></div><div class="say" id="sy">What number is it?</div><div class="row"><button onclick="h2(1)">Hint</button><button onclick="h2(2)">Show answer</button></div><div class="say" style="font-size:14px;min-height:0">Question <span id="qn">1</span> / 8</div></div>'+
 '<div class="panel" style="width:min(380px,100%)"><div class="chest" id="chest"><div class="lid"></div><div class="bx"><i></i></div><div class="coins" id="coins"></div></div><div class="lk" id="lk"></div><div class="pad" id="pad"></div></div>';

 for(let d=0;d<10;d++){const b=document.createElement('button');b.className='key';b.id='k'+d;b.textContent=d;b.onclick=()=>pad2(d);$('#pad').appendChild(b)}
 showQ()}});
function showQ(){const it=q2[qi];hh=0;
 $('#rw').innerHTML=ph(it.k)+'<svg class="dn" viewBox="0 0 100 100"><path class="t1" d="'+it.d+'" stroke-width="'+(it.sw+2.4)+'"/><path class="t2" d="'+it.d+'" stroke-width="'+it.sw+'"/></svg>';
 $('#lt').textContent='Look at the drawn number. What does it make?';$('#sy').innerHTML='Say: The ___ makes a ___.';$('#qn').textContent=qi+1;
 document.querySelectorAll('.dg').forEach((d,i)=>d.classList.toggle('cur',i==qi))}
function h2(m){const it=q2[qi];if(m==2){say('<span class="ans">'+S2(it,lv(),2)+'</span>');return}hh=Math.min(hh+1,2);say('<span class="ans">'+S2(it,lv(),hh-1)+'</span>')}
function pad2(d){if(open2)return;const it=q2[qi];
 if(d==it.n){const s=$('#d'+qi);s.textContent=d;s.classList.add('pop');$('#k'+d).classList.add('okk');setTimeout(()=>$('#k'+d).classList.remove('okk'),600);qi++;
  if(qi>=8){open2=true;document.querySelectorAll('.dg').forEach(x=>x.classList.remove('cur'));$('#chest').classList.add('open');$('#coins').innerHTML=Array.from({length:12},(_,i)=>'<i style="left:'+(8+i*7)+'%;animation-delay:'+(i*.08)+'s"></i>').join('');setTimeout(()=>celebrate('Treasure!','You found the secret code!'),1600)}
  else showQ()}
 else{$('#k'+d).classList.add('shake');setTimeout(()=>$('#k'+d).classList.remove('shake'),400);say('Look at the circle! What number is it?')}}
const Q3=[
 {q:'How old are you?',h:'I am ___ years old.',f:['When is your birthday?','What do you want for your birthday?']},
 {q:'What is your favorite number?',h:'My favorite number is ___.',f:['Why do you like it?','Is it a big number or a small number?']},
 {q:'How many people are in your family?',h:'There are ___ people in my family.',f:['Who are they?','Who is the tallest?']},
 {q:'How many pets do you have?',h:'I have ___ pets. / I have no pets.',f:['What pet do you want?','What animal do you like?']},

A.push({h:'3. My Secret Code',tip:'<ol><li>Ask the question on the screen. The student answers about themselves in a full sentence, for example "I am eight years old."</li><li>The student taps the number from their answer on the keypad. It goes into the secret code and an animal body part that makes that number appears.</li><li>The student says the sentence frame "The ___ makes a ___." (example: "The snake’s body makes an eight.") Number 3 and 4 have no animal: ask the student to show it with fingers.</li><li>Press Next for the next question. If the answer is bigger than 9, the student chooses one digit. Hint gives the answer starter. Follow-up question keeps the student talking. After 5 numbers, the chest opens: "My secret code is ___!"</li></ol>',run:el=>{
 i3=0;ph3='ask';c3=[];hh3=0;done3=false;
 el.innerHTML='<div class="panel" id="lp3" style="width:min(380px,100%)"></div>'+
 '<div class="panel" style="width:min(380px,100%)"><div class="chest" id="chest"><div class="lid"></div><div class="bx"><i></i></div><div class="coins" id="coins"></div></div><div class="lk" id="lk"></div><div class="pad" id="pad"></div><div class="row"><button class="sm" onclick="nc3()">New code</button></div></div>';
 $('#lk').innerHTML=Array.from({length:5},(_,i)=>'<div class="dg" id="d'+i+'">?</div>').join('');
 for(let d=0;d<10;d++){const b=document.createElement('button');b.className='key';b.id='k'+d;b.textContent=d;b.onclick=()=>pad3(d);$('#pad').appendChild(b)}
 render3()}});
function cur3(){document.querySelectorAll('#lk .dg').forEach((d,i)=>d.classList.toggle('cur',!done3&&i==i3))}
function render3(){const q=Q3[i3],lp=$('#lp3');hh3=0;
 const top='<div class="say" style="font-size:15px;color:#2c3e8f;min-height:0">Question <b>'+(i3+1)+'</b> / 5</div>';
 const btn='<div class="row"><button onclick="h3()">Hint</button><button onclick="f3()">Follow-up question</button>';
 if(ph3=='ask'){lp.innerHTML=top+'<div class="bigq">'+q.q+'</div><div class="say" id="sy" style="font-size:16px">Answer in English. Then tap your number!</div>'+btn+'</div>'}
 else{const d=c3[i3],it=IT2.find(x=>x.n==d);
  const pic=it?ph(it.k)+'<svg class="dn" viewBox="0 0 100 100"><path class="t1" d="'+it.d+'" stroke-width="'+(it.sw+2.4)+'"/><path class="t2" d="'+it.d+'" stroke-width="'+it.sw+'"/></svg>':'<div class="big3">'+d+'</div>';
  lp.innerHTML='<div class="say" style="font-size:15px;color:#2c3e8f;min-height:0">'+q.q+'</div><div class="rw" id="rw">'+pic+'</div><div class="say" id="sy" style="font-size:16px">'+(it?'Say: The ___ makes a ___.':'No animal makes a '+d+'. Show '+d+' with your fingers!')+'</div>'+btn+'<button class="go" onclick="nx3()">'+(i3>=4?'Open!':'Next →')+'</button></div>'}
 cur3()}
function h3(){const q=Q3[i3];if(ph3=='ask'){say('<span class="ans">'+q.h+'</span>');return}
 const d=c3[i3],it=IT2.find(x=>x.n==d);if(!it){say('<span class="ans">Say: '+NW[d]+'!</span>');return}
 hh3=Math.min(hh3+1,3);say('<span class="ans">'+[0,'The ___ makes a ___.','The '+it.part+' makes a ___.',S2(it,3,2)][hh3]+'</span>')}
function f3(){const q=Q3[i3];say('<span class="ans">'+q.f[Math.floor(Math.random()*q.f.length)]+'</span>')}
function pad3(d){if(done3)return;if(ph3=='show'){say('Press Next!');return}
 c3[i3]=d;const s=$('#d'+i3);s.textContent=d;s.classList.add('pop');$('#k'+d).classList.add('okk');setTimeout(()=>$('#k'+d).classList.remove('okk'),600);ph3='show';render3()}
function nx3(){if(i3>=4){done3=true;cur3();$('#chest').classList.add('open');$('#coins').innerHTML=Array.from({length:12},(_,i)=>'<i style="left:'+(8+i*7)+'%;animation-delay:'+(i*.08)+'s"></i>').join('');setTimeout(()=>celebrate('Treasure!','My secret code is '+c3.join('-')+'!'),1600);return}
 i3++;ph3='ask';render3()}
function nc3(){i3=0;ph3='ask';c3=[];done3=false;$('#chest').classList.remove('open');$('#coins').innerHTML='';$('#lk').innerHTML=Array.from({length:5},(_,i)=>'<div class="dg" id="d'+i+'">?</div>').join('');render3()}

A.forEach((a,i)=>{const d=document.createElement('div');d.className='tab';d.textContent='Mission '+(i+1);d.onclick=()=>go(i);$('#tabs').appendChild(d)});
