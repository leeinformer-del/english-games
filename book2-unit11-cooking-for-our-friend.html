<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cooking for Our Friend</title>
<style>
:root{--ink:#2b2a3a;--a:#c2410c;--b:#2a9d8f;--sun:#ffd84a;--bg1:#fff3e3;--bg2:#f7cf9f;--red:#ff5c5c;--ok:#2fb86a;box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Baloo 2","Comic Sans MS","Chalkboard SE",system-ui,sans-serif;background:linear-gradient(var(--bg1),var(--bg2));color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:8px;padding:6px 14px;flex-wrap:wrap}
.tab{padding:5px 14px;border-radius:99px;background:#fff9;font-weight:700;font-size:15px;cursor:pointer}
.tab.on{background:var(--a);color:#fff}
#h{flex:1;font-size:clamp(17px,2.6vw,26px);font-weight:800;min-width:150px}
#t{font-size:28px;font-weight:800;background:#fff;border-radius:14px;padding:0 12px;min-width:86px;text-align:center}
#t.low{background:var(--red);color:#fff}
button{font:inherit;font-weight:800;border:0;border-radius:14px;padding:8px 16px;background:var(--sun);color:var(--ink);cursor:pointer}
button.sm{background:#fff;padding:6px 12px;font-size:15px;opacity:.85}
button.go{background:var(--a);color:#fff;font-size:20px;padding:10px 24px}
button:disabled{opacity:.4;cursor:default}
main{flex:1;min-height:0;display:flex;gap:14px;align-items:center;justify-content:center;padding:4px 14px 8px}
.panel{background:#fff;border-radius:22px;padding:12px 16px;box-shadow:0 6px 0 #0002;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.say{font-size:clamp(18px,2.8vh,26px);font-weight:800;min-height:30px}
.ans{color:#c0392b}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.row button{background:#ffe9a8;font-size:15px}
.pl{background:repeating-linear-gradient(45deg,#e9e4f5,#e9e4f5 10px,#f4f1fb 10px,#f4f1fb 20px);border:3px dashed #b9b0d8;border-radius:16px;display:grid;place-items:center;color:#7a6fa8;font-weight:800;text-align:center;padding:4px;aspect-ratio:1;min-width:0}
.pl span{font-size:clamp(11px,2vh,18px);line-height:1.1}
img.ph,.pl{width:100%;aspect-ratio:1}
img.ph{object-fit:cover;border-radius:16px;display:block}
#tip{padding:6px 16px;background:#fff9;font-size:14px;max-height:36vh;overflow:auto;display:none}
#tip ol{margin:4px 0 6px;padding-left:22px}#tip li{margin:2px 0}
#ro{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9}
#ro>div{background:#fff;border-radius:24px;padding:26px 36px;text-align:center;font-size:clamp(24px,5vw,40px);font-weight:800;max-width:90vw}
#ro small{display:block;font-size:18px;font-weight:700;margin:8px 0 14px;color:#666}
.star{display:inline-block;width:1em;height:1em;background:var(--sun);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);vertical-align:-.1em}
.qb{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(560px,100%)}
.qc{position:relative;aspect-ratio:1.25;border-radius:16px;border:5px solid var(--a);background:var(--bg2);color:var(--a);font-size:clamp(34px,7vh,60px);font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;padding:6px}
.qc u{position:absolute;top:3px;left:8px;font-size:13px;text-decoration:none;background:#fffc;border-radius:6px;padding:0 5px;color:var(--ink)}
.qc.dn{background:#e8f5e9;border-color:#9bd3ae;color:var(--ink);opacity:.65;font-size:clamp(13px,2.2vh,20px);line-height:1.2}
.qc.dn.on{background:#fff2a8;border-color:var(--red);opacity:1}
.qbig{font-size:clamp(26px,5vh,42px);font-weight:800;line-height:1.2}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:none}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pop .45s}
.row button.go{background:var(--a);color:#fff}.shake{animation:shake .35s}
#t,#tb{display:none!important}
.lg{display:grid;grid-template-columns:repeat(var(--c,4),min(var(--s,17vh),130px));gap:8px;justify-content:center}
.lt{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;background:#fff;border:4px solid #fff;box-shadow:0 2px 0 #0002;cursor:pointer}
.lt .ph,.lt .pl{width:100%;height:100%;border-radius:0}
.lt .lbd{position:absolute;left:0;right:0;bottom:0;background:var(--a);color:#fff;font-weight:800;text-align:center;font-size:clamp(12px,2.1vh,17px);padding:3px 0;display:none}
.lt.sw .lbd{display:block}
.ok7{background:#2eae60!important;color:#fff!important}
.wr8{background:#e05a4f!important;color:#fff!important}
.av{width:clamp(70px,13vh,100px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:clamp(30px,6vh,50px)}
.nmt{font-size:clamp(20px,3.6vh,30px);font-weight:800}
.tg{position:absolute;left:0;right:0;bottom:0;z-index:5;color:#fff;font-weight:800;font-size:clamp(11px,2vh,16px);text-align:center;padding:2px;background:var(--a)}
.fill{position:relative;overflow:hidden}
.fill .ph,.fill .pl{position:absolute;inset:0;width:100%;height:100%;border-radius:0}
.bm{width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:20px solid var(--b)}
.bv{position:relative;overflow:hidden;width:100%;height:calc(min(17vh,126px) + 22px);background:linear-gradient(#e8d5bd,#cfae85);border-radius:14px}
.bl{display:flex;gap:10px;position:absolute;left:0;top:10px;will-change:transform}
.bi{position:relative;flex:none;width:min(17vh,126px);aspect-ratio:1;border-radius:12px;overflow:hidden;border:4px solid #fff;background:#fff}
.bi .ph,.bi .pl{width:100%;height:100%;border-radius:0}
.bi .lbd{position:absolute;left:0;right:0;bottom:0;background:var(--a);color:#fff;font-weight:800;text-align:center;font-size:clamp(13px,2.3vh,19px);padding:3px 0;display:none}
.bi.sw .lbd{display:block}
.bf{position:absolute;left:50%;top:4px;transform:translateX(-50%);height:calc(min(17vh,126px) + 14px);border:5px solid var(--b);border-radius:16px;pointer-events:none}
.m2r{display:flex;align-items:flex-end;justify-content:center;gap:clamp(24px,6vw,80px)}
.ck,.jn{display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.hat{width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-bottom:44px solid #e63946;margin-bottom:-12px;z-index:2}
.potw{position:relative;width:clamp(130px,22vh,170px);height:clamp(110px,18vh,140px)}
.pot{position:absolute;left:0;right:0;bottom:0;height:62%;background:#3d3d4a;border-radius:6px 6px 70px 70px}
.pot:before,.pot:after{content:"";position:absolute;top:10px;width:18px;height:12px;background:#3d3d4a;border-radius:6px}
.pot:before{left:-14px}.pot:after{right:-14px}
.lid{position:absolute;left:-6px;right:-6px;top:-14px;height:20px;background:#5a5a6a;border-radius:20px 20px 4px 4px;transition:transform .5s}
.lid.up{transform:translate(-45%,-46px) rotate(-28deg)}
.dsh{position:absolute;left:50%;bottom:34%;width:70%;aspect-ratio:1;margin-left:-35%;border-radius:50%;overflow:hidden;border:4px solid #fff;transform:scale(0);z-index:3}
.dsh .ph,.dsh .pl{width:100%;height:100%;border-radius:0}
.dsh.in{animation:pop .7s forwards}
.stm{position:absolute;left:30%;top:-22px;width:40%;height:30px;display:flex;justify-content:space-around;opacity:.7}
.stm i{width:10px;height:10px;border-radius:50%;background:#fff;animation:stm 1.4s infinite}
.stm i:nth-child(2){animation-delay:.4s}.stm i:nth-child(3){animation-delay:.8s}
@keyframes stm{from{transform:translateY(20px);opacity:0}50%{opacity:.9}to{transform:translateY(-14px);opacity:0}}
.tbl{display:flex;gap:6px;justify-content:center;padding:8px 10px;background:#b5835a;border-radius:12px}
.ts{position:relative;width:min(9vh,64px);aspect-ratio:1;border-radius:50%;background:#e6c9a4;border:3px dashed #8a5d36;overflow:hidden}
.ts.f{border:3px solid #fff;background:#fff}
.ts .ph,.ts .pl{position:absolute;inset:0;width:100%;height:100%;border-radius:0}
.ts .tg{font-size:10px;padding:0;background:rgba(0,0,0,.55)}
.mt{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.mi{position:relative;width:min(13vh,92px);aspect-ratio:1;border-radius:12px;overflow:hidden;border:4px solid #fff;box-shadow:0 2px 0 #0002;cursor:pointer}
.mi .ph,.mi .pl{position:absolute;inset:0;width:100%;height:100%;border-radius:0}
.mi.used{filter:grayscale(1) opacity(.4);cursor:default}
.pls{display:flex;gap:8px;justify-content:center}
.pl3{position:relative;width:min(11vh,80px);aspect-ratio:1;border-radius:50%;background:#fff;border:4px dashed #e0a56a;overflow:hidden}
.pl3.f{border:4px solid #fff;box-shadow:0 2px 0 #0003}
.pl3 .ph,.pl3 .pl{position:absolute;inset:0;width:100%;height:100%;border-radius:0}

.sc11{display:flex;align-items:center;justify-content:center;gap:clamp(12px,3vw,34px)}
.dsh2{position:relative;width:min(17vh,124px);aspect-ratio:1;border-radius:50%;overflow:hidden;border:5px solid #fff;box-shadow:0 3px 0 #0003}
.dsh2 .ph,.dsh2 .pl{position:absolute;inset:0;width:100%;height:100%;border-radius:0}
.ar11{width:clamp(30px,5vw,56px);height:14px;background:var(--b);position:relative;border-radius:7px}
.ar11:after{content:"";position:absolute;right:-12px;top:-9px;border-left:18px solid var(--b);border-top:16px solid transparent;border-bottom:16px solid transparent}
.fr11{font-size:clamp(22px,4.2vh,34px);font-weight:700;color:var(--ink);min-height:44px}
.bl11{display:inline-block;min-width:70px;border-bottom:4px solid var(--b);color:transparent}
.fr11 b{color:var(--a)}
.chs{display:flex;gap:12px;justify-content:center;min-height:min(14vh,104px)}
.ch11{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 10px;border-radius:14px;background:#fff7ec;border:3px solid #f0c48c;cursor:pointer;min-width:min(12vh,92px)}
.ch11:hover{background:#ffeccd}
.ch11 .av{width:clamp(48px,8vh,64px);font-size:clamp(22px,4vh,32px)}
.chp{position:relative;width:min(8vh,60px);aspect-ratio:1;border-radius:10px;overflow:hidden}
.chp .ph,.chp .pl{position:absolute;inset:0;width:100%;height:100%;border-radius:0}

.cs11{display:flex;flex-direction:column;align-items:center;cursor:pointer;min-width:min(18vh,130px)}
.cb11{width:min(17vh,124px);aspect-ratio:1;border-radius:18px;background:linear-gradient(135deg,var(--a),#e8863a);color:#fff;font-weight:800;font-size:clamp(15px,2.6vh,20px);display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 #0003;border:4px solid #fff}
.cbq{font-size:clamp(34px,7vh,54px);line-height:1}
.cc11{flex-direction:column;align-items:center;gap:4px;min-height:min(17vh,124px);justify-content:center}
.cc11 .av,.cc11 .dsh2{flex:none}.cc11 .nmt{flex:none}.cc11{width:min(17vh,124px)}

.tw11{width:min(17vh,124px);aspect-ratio:1;border-radius:18px;background:#fff7ec;border:4px solid #f0c48c;display:grid;place-items:center;font-size:clamp(18px,3.4vh,28px);font-weight:800;color:var(--a);text-align:center;padding:4px;line-height:1.1}
.sbig{position:relative;width:min(30vh,200px);aspect-ratio:1;border-radius:18px;overflow:hidden;border:5px solid #fff;box-shadow:0 4px 0 #0003}.sbig .ph,.sbig .pl{position:absolute;inset:0;width:100%;height:100%;border-radius:0}

.ib11{gap:6px;padding:6px}
.ib11 input{width:88%;font:inherit;font-weight:800;font-size:clamp(16px,2.8vh,22px);text-align:center;border:3px solid #fff;border-radius:10px;padding:6px 4px;background:#fff;color:var(--a)}
.ib11 input:focus{outline:3px solid var(--b)}
.cb11.ib11{width:min(25vh,172px);aspect-ratio:auto;min-height:min(15vh,104px)}.ib11 input{width:90%}.cs11{min-width:0}

</style></head><body>

<main id="st"></main>
<div id="tip"><div id="tt"></div></div>

function ph(k,c){return IMG[k]?'<img class="ph '+(c||'')+'" src="'+IMG[k]+'" alt="">':'<div class="pl '+(c||'')+'"><span>'+(LBL[k]||k)+'</span></div>'}
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const DUR=[180, 180, 360];
let cur=0,secs=0,iv=null;
function fmt(){$('#t').textContent=Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0');$('#t').classList.toggle('low',secs<=30)}
function tog(){if(iv){clearInterval(iv);iv=null;$('#tb').textContent='Start'}else{iv=setInterval(()=>{secs>0?(secs--,fmt()):tog()},1000);$('#tb').textContent='Pause'}}
function tgl(){const t=$('#tip');t.style.display=t.style.display=='block'?'none':'block'}
function say(h){$('#sy').innerHTML=h}
function fin(){celebrate('Happy Birthday, June!','We cook for our friend!')}
function celebrate(m,s){$('#rm').innerHTML=m;$('#rs').textContent=s||'';$('#ro').style.display='flex'}
function qcards(el,QS){
  const cells=QS.map(x=>({...x}));let last=-1;
  el.innerHTML='<div class="qb" id="qb"></div><div class="panel" id="qp" style="width:min(440px,100%);min-height:260px"><div class="qbig" id="qq">Tap a card!</div><div class="say" id="sy"></div><div class="row" id="qr"></div></div>';
  cells.forEach((c,i)=>{const d=document.createElement('div');d.className='qc';d.id='q'+i;d.innerHTML='<u>'+(i+1)+'</u>?';d.onclick=()=>{
    if(c.dn)return;c.dn=1;document.querySelectorAll('.qc').forEach(e=>e.classList.remove('on'));
    d.className='qc dn on pop';d.innerHTML='<u>'+(i+1)+'</u>'+c.q;
    $('#qq').textContent=c.q;say('');
    $('#qr').innerHTML='<button onclick="say(\'<span class=ans>'+c.h.replace(/'/g,"\\'")+'</span>\')">Hint</button><button onclick="say(\'<span class=ans>'+c.f.replace(/'/g,"\\'")+'</span>\')">Follow-up question</button>';
    if(cells.every(x=>x.dn))setTimeout(()=>celebrate('All cards open!','Great talking!'),700)};
    $('#qb').appendChild(d)});
}
const A=[];
function go(i){if(iv)tog();cur=i;secs=DUR[i];fmt();
  document.querySelectorAll('.tab').forEach((e,j)=>e.classList.toggle('on',j==i));
  $('#nx').style.display=i==A.length-1?'none':'';$('#fn').style.display=i==A.length-1?'':'none';
  $('#tt').innerHTML=A[i].tip;$('#h').textContent=A[i].h;$('#st').innerHTML='';A[i].run($('#st'))}

/* shared helpers */
function Llearn(el,items,start,title){const n=items.length;
 el.innerHTML='<div class="panel" style="width:auto"><div class="lg" style="--c:'+(n<=6?3:4)+'">'+items.map((x,i)=>'<div class="lt" id="lt'+i+'">'+ph(x[0])+'<div class="lbd">'+x[1]+'</div></div>').join('')+'</div><div class="say" id="sy">'+(title||'Tap a picture. Say the word!')+'</div><div class="row"><button class="go" onclick="'+start+'()">Start the game!</button></div></div>';
 items.forEach((x,i)=>{$('#lt'+i).onclick=()=>$('#lt'+i).classList.toggle('sw')})}
const LB={sc:[],ph:0,hn:0,n:0,N:0,max:3,hint:null,reveal:null,render:null,fin:['','']};
function Lbtns(){return '<div class="row" id="lbr"><button onclick="Lhint()">Hint</button><button class="go" id="gob" onclick="Lgo()">Check answer</button><button class="ok7" id="okb" onclick="Lok()" style="display:none">Correct!</button><button class="wr8" id="wrb" onclick="Lwr()" style="display:none">Wrong</button></div><div class="say" id="sn" style="font-size:16px;min-height:0"></div>'}
function Lstart(N,render,hint,reveal,fin){LB.sc=[];LB.ph=0;LB.hn=0;LB.n=0;LB.N=N;LB.render=render;LB.hint=hint;LB.reveal=reveal;LB.fin=fin;render()}
function Lbar(){const s=LB.sc.reduce((a,b)=>a+b,0),e=$('#sn');if(e)e.innerHTML='Round '+(LB.n+1)+' of '+LB.N+' · <span class="star"></span> '+s+' / '+(LB.N*3)}
function Lnew(){LB.ph=0;LB.hn=0}
function Lhint(){if(LB.ph!=0)return;LB.hn=1;say('<span class="ans">'+LB.hint()+'</span>')}
function Lgo(){if(LB.ph==0){LB.ph=1;say('<span class="ans">'+LB.reveal()+'</span> Did the student say it?');$('#gob').style.display='none';$('#okb').style.display='';$('#wrb').style.display='';return}
 if(LB.ph==2){if(LB.n>=LB.N-1){const s=LB.sc.reduce((a,b)=>a+b,0);celebrate(LB.fin[0],LB.fin[1].replace('#',s+' of '+LB.N*3+' stars'));return}LB.n++;Lnew();LB.render()}}
function Lok(){Ljd(LB.hn?2:3)}function Lwr(){Ljd(0)}
function Ljd(p){if(LB.ph!=1)return;LB.sc.push(p);LB.ph=2;$('#okb').style.display='none';$('#wrb').style.display='none';const g=$('#gob');g.style.display='';g.textContent=LB.n>=LB.N-1?'Finish':'Next round';say(p?'<span class="ans" style="color:#1f8a4c">Great! +'+p+' stars</span>':'<span class="ans" style="color:#c0392b">Good try! Next time!</span>');Lbar()}
const F11=[['hamburger','hamburger'],['meat','meat'],['soup','soup'],['cake','cake'],['birthday','birthday'],['cook','cook'],['friend','friend']];
A.push({h:'1. Pass the Plate',tip:'<ol><li>FIRST (Look &amp; Say): seven pictures are shown. The student taps a picture, says the word, and the word appears. (Word "our" has no picture: use it in a sentence, "This is our teacher.")</li><li>Press "Start the game!" A belt moves the pictures along. Press "Stop!" and the belt slows down and stops on one picture. Ask "What is it?" The student says the word (for example, "soup").</li><li>"Hint" = the first letter. Press "Check answer", then "Correct!" or "Wrong." STARS: 3 = no help, 2 = used Hint, 0 = Wrong (18 in all). 6 rounds.</li></ol>',run:el=>{Llearn(el,F11,'m11s')}});
let o11=[],bx=0,bst=0,bw=140,bseq=[],bk=0,btk=0;
function m11s(){o11=shuf(F11.map((_,i)=>i)).slice(0,6);Lstart(6,m11r,()=>'It starts with "'+F11[o11[LB.n]][1][0]+'".',()=>{const t=$('#bi'+bk);if(t)t.classList.add('sw');return 'It is '+F11[o11[LB.n]][1]+'.'},['Ready to cook!','You got # !'])}
function m11r(){const el=$('#st');bseq=[];const base=shuf(F11.map((_,i)=>i));for(let r=0;r<9;r++)bseq=bseq.concat(base);bst=0;btk++;
 el.innerHTML='<div class="panel" style="width:min(900px,100%)"><div class="bm"></div><div class="bv" id="bv"><div class="bl" id="bl">'+bseq.map((i,j)=>'<div class="bi" id="bi'+j+'">'+ph(F11[i][0])+'<div class="lbd">'+F11[i][1]+'</div></div>').join('')+'</div><div class="bf" id="bf"></div></div><div class="say" id="sy" style="font-size:clamp(20px,3.6vh,30px)">The plates are moving!</div><div class="row" id="rw"><button class="go" onclick="m11st()">Stop!</button></div></div>';
 const w=$('#bi0').getBoundingClientRect().width;bw=w+10;$('#bf').style.width=(w+14)+'px';bx=Math.random()*bw*7;Lbar();m11tk(btk)}
function m11tk(id){if(id!=btk||!$('#bl'))return;if(bst==0){bx+=3.2;if(bx>bw*7*5)bx-=bw*7}$('#bl').style.transform='translateX('+(-bx)+'px)';requestAnimationFrame(()=>m11tk(id))}
function m11st(){if(bst!=0)return;bst=1;const W=bw-10,vw=$('#bv').clientWidth,t=o11[LB.n];let fc=Math.floor((bx+vw/2)/bw)+4,k=fc;while(bseq[k]!=t)k++;bk=k;const tx=k*bw+W/2-vw/2,x0=bx,t0=performance.now(),D=1700,id=btk;
 const f=now=>{if(id!=btk||!$('#bl'))return;let p=Math.min(1,(now-t0)/D);const e=1-Math.pow(1-p,3);bx=x0+(tx-x0)*e;$('#bl').style.transform='translateX('+(-bx)+'px)';if(p<1)requestAnimationFrame(f);else{bst=2;m11ld()}};requestAnimationFrame(f)}
