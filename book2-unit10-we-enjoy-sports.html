<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sports Week – We Enjoy Sports</title>
<style>
:root{--ink:#2b2a3a;--a:#2f7d32;--b:#ff7043;--sun:#ffd84a;--bg1:#e9f7e6;--bg2:#bfe2b8;--red:#ff5c5c;--ok:#2fb86a;box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Baloo 2","Comic Sans MS","Chalkboard SE",system-ui,sans-serif;background:linear-gradient(var(--bg1),var(--bg2));color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:8px;padding:6px 14px;flex-wrap:wrap}
.tab{padding:5px 14px;border-radius:99px;background:#fff9;font-weight:700;font-size:15px;cursor:pointer}
.tab.on{background:var(--a);color:#fff}
#h{flex:1;font-size:clamp(17px,2.6vw,26px);font-weight:800;min-width:150px}
#t{font-size:28px;font-weight:800;background:#fff;border-radius:14px;padding:0 12px;min-width:86px;text-align:center}
#t.low{background:var(--red);color:#fff}
button{font:inherit;font-weight:800;border:0;border-radius:14px;padding:8px 16px;background:var(--sun);color:var(--ink);cursor:pointer}
button.sm{background:#fff;padding:6px 12px;font-size:15px;opacity:.85}
button.go{background:var(--a);color:#fff;font-size:20px;padding:10px 24px}
button:disabled{opacity:.4;cursor:default}
main{flex:1;min-height:0;display:flex;gap:14px;align-items:center;justify-content:center;padding:4px 14px 8px}
.panel{background:#fff;border-radius:22px;padding:12px 16px;box-shadow:0 6px 0 #0002;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.say{font-size:clamp(18px,2.8vh,26px);font-weight:800;min-height:30px}
.ans{color:#c0392b}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.row button{background:#ffe9a8;font-size:15px}
.pl{background:repeating-linear-gradient(45deg,#e9e4f5,#e9e4f5 10px,#f4f1fb 10px,#f4f1fb 20px);border:3px dashed #b9b0d8;border-radius:16px;display:grid;place-items:center;color:#7a6fa8;font-weight:800;text-align:center;padding:4px;aspect-ratio:1;min-width:0}
.pl span{font-size:clamp(11px,2vh,18px);line-height:1.1}
img.ph,.pl{width:100%;aspect-ratio:1}
img.ph{object-fit:cover;border-radius:16px;display:block}
#tip{padding:6px 16px;background:#fff9;font-size:14px;max-height:36vh;overflow:auto;display:none}
#tip ol{margin:4px 0 6px;padding-left:22px}#tip li{margin:2px 0}
#ro{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9}
#ro>div{background:#fff;border-radius:24px;padding:26px 36px;text-align:center;font-size:clamp(24px,5vw,40px);font-weight:800;max-width:90vw}
#ro small{display:block;font-size:18px;font-weight:700;margin:8px 0 14px;color:#666}
.star{display:inline-block;width:1em;height:1em;background:var(--sun);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);vertical-align:-.1em}
.qb{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(560px,100%)}
.qc{position:relative;aspect-ratio:1.25;border-radius:16px;border:5px solid var(--a);background:var(--bg2);color:var(--a);font-size:clamp(34px,7vh,60px);font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;padding:6px}
.qc u{position:absolute;top:3px;left:8px;font-size:13px;text-decoration:none;background:#fffc;border-radius:6px;padding:0 5px;color:var(--ink)}
.qc.dn{background:#e8f5e9;border-color:#9bd3ae;color:var(--ink);opacity:.65;font-size:clamp(13px,2.2vh,20px);line-height:1.2}
.qc.dn.on{background:#fff2a8;border-color:var(--red);opacity:1}
.qbig{font-size:clamp(26px,5vh,42px);font-weight:800;line-height:1.2}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:none}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pop .45s}
.row button.go{background:var(--a);color:#fff}.shake{animation:shake .35s}
#t,#tb{display:none!important}
.wk10{position:relative;padding-top:0}
.tr10{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;width:calc(min(17vh,138px)*4 + 40px);margin:0 auto}
.dt{position:relative;width:min(17vh,138px);aspect-ratio:1;border-radius:12px;overflow:hidden;background:#fff;border:4px solid #fff;cursor:pointer}
.dt .ph,.dt .pl{width:100%;height:100%;border-radius:0}
.dt .lbd{position:absolute;left:0;right:0;bottom:0;background:var(--a);color:#fff;font-weight:800;text-align:center;font-size:clamp(11px,2vh,16px);padding:3px 0;display:none}
.dt.sw .lbd{display:block}
.dt .qq{position:absolute;top:6px;right:6px;width:36px;height:36px;border-radius:50%;display:none;place-items:center;font-size:24px;font-weight:800;color:#fff;background:var(--b);box-shadow:0 2px 4px #0004}
.dt.tg .qq{display:grid}.dt.tg{border-color:var(--b)}
.dt.hl{border-color:var(--b)}
.dt.pop8{animation:pop .6s}
.ball10{position:absolute;top:0;width:26px;height:26px;margin-left:-13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffb08f,var(--b));box-shadow:0 2px 4px #0003;transition:left .6s ease;animation:bn10 .5s ease-in-out infinite alternate}
@keyframes bn10{from{transform:translateY(0)}to{transform:translateY(-8px)}}
.ok7{background:#2eae60!important;color:#fff!important}
.wr8{background:#e05a4f!important;color:#fff!important}
/* M2 */
.m2w{display:flex;gap:22px;align-items:center;justify-content:center}
.kid{display:flex;flex-direction:column;align-items:center;gap:6px;width:clamp(100px,18vh,150px)}
.av{width:clamp(80px,15vh,120px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:clamp(34px,7vh,58px)}
.nmt{font-size:clamp(22px,4vh,34px);font-weight:800}
.kid.hmm .av{animation:hm .35s infinite}
@keyframes hm{50%{transform:translateY(-8px) rotate(-6deg)}}
.cal{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;width:calc(min(21.5vh,140px)*7 + 60px);flex-wrap:nowrap}
.cs{display:flex;flex-direction:column;align-items:center;gap:3px}
.cs .dy{font-weight:800;font-size:clamp(13px,2.2vh,18px);color:var(--a)}
.cs.hl .dy{color:#fff;background:var(--b);border-radius:99px;padding:0 8px}
.sl{position:relative;width:min(21.5vh,140px);aspect-ratio:1;border-radius:12px;border:3px dashed #7fb87a;background:#f1fbef;display:grid;place-items:center;color:#7fb87a;font-weight:800;font-size:clamp(22px,4vh,36px);overflow:hidden}
.sl.bt{border:3px solid #fff;background:#fff}
.sl .ph,.sl .pl{position:absolute;inset:0;width:100%;height:100%;border-radius:0}
.sl.grow .ph,.sl.grow .pl{animation:pp 1s cubic-bezier(.3,1.5,.5,1) both}
@keyframes pp{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
.sl .tg{position:absolute;left:0;right:0;bottom:0;z-index:5;color:#fff;font-weight:800;font-size:clamp(12px,2.2vh,18px);text-align:center;padding:2px}
.brk{flex-basis:100%;height:0}
.ex .sl:not(.bt){border-color:#ffb08f;background:#fff1ea;color:#ffb08f}
/* M3 */
.wk{display:flex;gap:6px;justify-content:center}
.dc{position:relative;width:clamp(48px,8.4vh,70px);padding:14px 0 6px;border-radius:12px;background:#fff9;font-weight:800;text-align:center;font-size:clamp(13px,2.3vh,18px);transition:background .4s}
.dc.on{background:var(--a);color:#fff}
.dc .bl{position:absolute;top:-4px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--b);opacity:0}
.dc.on .bl{opacity:1;animation:bnc .6s ease-in-out infinite alternate}
@keyframes bnc{from{transform:translateY(0)}to{transform:translateY(-8px)}}
.tr{width:min(26vh,220px);border-radius:16px;overflow:hidden}
.ball10{display:none!important}.dt.hl,.dt.tg{outline:4px solid var(--b)}

.bc{display:flex;gap:14px;align-items:center;justify-content:center}
.bcd{position:relative;width:min(34vh,270px);aspect-ratio:1;border-radius:14px;overflow:hidden;background:#fff;border:4px solid #fff;box-shadow:0 3px 8px #0002}
.bcd .ph,.bcd .pl{width:100%;height:100%;border-radius:0}
.bcd .lbd{position:absolute;left:0;right:0;bottom:0;background:var(--a);color:#fff;font-weight:800;text-align:center;font-size:clamp(18px,3.4vh,28px);padding:4px 0;display:none}
.bcd.sw .lbd{display:block}
.bcd.bq{background:#f1fbef;border:4px dashed #7fb87a}
.qm10{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(50px,12vh,100px);font-weight:800;color:#7fb87a}
.chv{font-size:clamp(28px,5vh,44px);color:var(--a);font-weight:800}

.cs .sn{min-height:24px;font-weight:800;font-size:clamp(14px,2.6vh,20px);color:#222;text-align:center}

.m3w{display:flex;gap:26px;align-items:center;justify-content:center}
.gr{display:grid;grid-template-columns:repeat(3,min(14.5vh,98px));gap:6px}
.gc{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;border:3px solid #fff;box-shadow:0 2px 0 #0002;transition:transform .1s}
.gc .ph,.gc .pl{position:absolute;inset:0;width:100%;height:100%;border-radius:0}
.gc.hi{border-color:var(--b);transform:scale(1.08);z-index:2;box-shadow:0 0 0 3px var(--b)}
.gc.used{filter:grayscale(.9) opacity(.45)}
.m3r{width:min(400px,40vw);text-align:center}
.wkt{font-weight:800;font-size:clamp(13px,2.2vh,17px);color:var(--a)}
.wks{display:flex;gap:8px;justify-content:center}
.ws{display:flex;flex-direction:column;align-items:center;gap:2px}
.wd{font-weight:800;font-size:clamp(12px,2vh,16px)}
.wl{position:relative;width:min(10.5vh,72px);aspect-ratio:1;border-radius:10px;border:3px dashed #7fb87a;background:#f1fbef;overflow:hidden}
.wl.f{border:3px solid #fff;box-shadow:0 2px 0 #0002}
.wl .ph,.wl .pl{position:absolute;inset:0;width:100%;height:100%;border-radius:0}
.wl .tg{position:absolute;left:0;right:0;bottom:0;background:var(--a);color:#fff;font-weight:800;font-size:11px;text-align:center;padding:1px}
.wks.pk .wl:not(.f){border-color:var(--b);background:#fff3e6;cursor:pointer;animation:pkp .8s infinite alternate}
@keyframes pkp{to{transform:scale(1.07)}}
button:disabled{opacity:.45;cursor:default}

.c3p{position:relative;width:min(25vh,170px);aspect-ratio:1;border-radius:16px;overflow:hidden;border:4px solid #fff;box-shadow:0 3px 0 #0002}
.c3p .ph,.c3p .pl{position:absolute;inset:0;width:100%;height:100%;border-radius:0}
.c3p .tg{position:absolute;left:0;right:0;bottom:0;background:var(--a);color:#fff;font-weight:800;font-size:clamp(14px,2.4vh,19px);padding:3px}
.bks{display:flex;gap:14px;justify-content:center}
.bk{width:min(285px,29vw);min-height:min(19vh,118px);border-radius:14px;border:3px solid var(--bc);background:#fff;padding:6px 8px;display:flex;flex-direction:column;gap:4px;align-items:center}
.bk.pk{cursor:pointer;animation:pkp .8s infinite alternate;background:#fffaf2}
.bk.on{background:#f3fbf1}
.bkt{font-weight:800;font-size:clamp(15px,2.6vh,21px);color:var(--bc)}
.bkn{display:inline-block;min-width:24px;border-radius:99px;background:var(--bc);color:#fff;font-size:.8em;padding:0 6px}
.bkm{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.bkp{position:relative;width:min(7vh,46px);aspect-ratio:1;border-radius:8px;overflow:hidden}
.bkp .ph,.bkp .pl{position:absolute;inset:0;width:100%;height:100%;border-radius:0}


</style></head><body>

<main id="st"></main>
<div id="tip"><div id="tt"></div></div>
