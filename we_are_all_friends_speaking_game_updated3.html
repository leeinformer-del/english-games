const countries=[['Emma','Japan','japan','She is eating sushi. Look for the Japanese flag and Mount Fuji.'],['Lucas','France','france','He is enjoying a baguette. Look for the Eiffel Tower and the French flag.'],['Noah','Canada','canada','He is having pancakes with maple syrup. Look for a maple leaf and snowy mountains.'],['Sofia','Mexico','mexico','She is eating tacos. Look for colorful decorations and the Mexican flag.'],['Giulia','Italy','italy','She is eating pizza. Look for the Colosseum and the Italian flag.']];
const flagNames=['South Africa','South Korea','Russia','Mexico','India','United States','France','Japan'];
const challenge=[
{q:'Your new friend is sitting alone at camp. What can you say?',opts:['Come and play with us!','Good night!','I like blue.'],photo:'lonely_camp'},
{q:'Your friend is thinking about what to eat. What can you ask?',opts:['What would you like to eat?','Where is my pencil?','Are you a teacher?'],photo:'food_choices'},
{q:'You see a new friend at camp. What can you say?',opts:['Nice to meet you!','Go away!','I am a chair.'],photo:'france'},
{q:'Your friend shares a snack with you. What can you say?',opts:['Thank you!','Good night!','I am from a book.'],photo:'food_choices'},
{q:'Your friend asks you to play. What can you say?',opts:['Yes, let’s play!','Close the door!','I like blue.'],photo:'canada'}
];
const personal=[
['Where are you from?','I am from Korea.','france'],
['What is your favorite food?','My favorite food is pizza.','food_choices'],
['What do you like to do outside?','I like to play soccer.','canada'],
['What do you like to see when you travel?','I like to see famous places.','japan'],
['Where do you want to go?','I want to go to Mexico.','mexico']
];
let mission=0,photoIndex=0,deck=[],first=null,lock=false,matches=0,turns=0,challengeIndex=0,qIndex=0,sampleShown=false;
function show(n){mission=n;document.querySelectorAll('.tabs button').forEach((b,i)=>b.classList.toggle('active',i===n));draw()}
function draw(){let g=document.getElementById('game');
if(mission===0){let p=countries[photoIndex];g.innerHTML=`<div class="top"><div><div class="kicker">MISSION 1 · LOOK, THINK & SPEAK</div><h2>Guess the Country</h2></div><div class="progress">${photoIndex+1} / 5</div></div><p class="lead">Teacher asks: “Where is ${p[0]} from?” Look at the whole photo and say your answer aloud. No typing!</p><div class="grid"><img class="photo" src="${pics[p[2]]||''}" alt="Photo clues for ${p[1]}"><div class="side"><div class="hint">Look at the food, flag, and famous place for clues.</div><div class="question">Where is ${p[0]} from?</div><div class="actions"><button class="primary" onclick="checkCountry()">Check</button><button class="next" id="nextCountry" disabled onclick="nextCountry()">Next</button></div><div class="answer" id="countryAnswer">Say your answer aloud first.</div><p class="hint">${p[3]}</p></div></div>`}
if(mission===1){g.innerHTML=`<div class="top"><div><div class="kicker">MISSION 2 · MEMORY GAME</div><h2>Find the Matching Flags!</h2></div><div class="progress">${matches} / 8 pairs</div></div><p class="lead">Turn over two cards. Find two flags from the same country. Read the country name aloud when you turn over a card!</p><div class="memory">${deck.map((c,i)=>`<button class="flagcard ${c.open?'revealed':''} ${c.matched?'matched':''}" ${c.matched||c.open?'disabled':''} onclick="flip(${i})">${c.open||c.matched?`<img src="${flags[c.country]}" alt="${c.country} flag"><span class="country">${c.country}</span>`:'<span style="font-size:34px;color:#56808c">?</span>'}</button>`).join('')}</div><div class="memoryInfo">Moves: ${turns}　 ·　Pairs found: ${matches} / 8</div><div class="actions"><button onclick="newDeck()">Restart game</button></div><div class="answer" id="memoryFeedback">${matches===8?'You found all the flags! Great job!':'Teacher prompt: “Which country is this flag from?”'}</div>`}
if(mission===2){let c=challenge[challengeIndex];g.innerHTML=`<div class="top"><div><div class="kicker">MISSION 3 · CAMP CHALLENGE</div><h2>What Would You Say?</h2></div><div class="progress">${challengeIndex+1} / 5</div></div><p class="lead">Look at the situation. Choose what you would say, then say it aloud.</p><div class="split"><img class="scene" src="${pics[c.photo]||''}" alt="Situation photo"><div class="quiz"><div class="quizq">${c.q}</div><div class="answers">${c.opts.map((o,i)=>`<button class="answerChoice" onclick="chooseChallenge(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}</div><div class="answer" id="challengeFeedback">Think first. Then choose and speak!</div><div class="actions"><button onclick="challengeIndex=(challengeIndex+4)%5;draw()">Previous</button><button class="next" onclick="challengeIndex=(challengeIndex+1)%5;draw()">Next</button></div></div></div>`}
if(mission===3){let q=personal[qIndex];g.innerHTML=`<div class="top"><div><div class="kicker">MISSION 4 · PERSONAL SPEAKING</div><h2>Let’s Talk About You!</h2></div><div class="progress">${qIndex+1} / 5</div></div><p class="lead">Look at the photo and answer the question.</p><div class="m4wrap"><img class="m4photo" src="${pics[q[2]]||''}" alt="Photo prompt"><div class="questionBox"><div class="simpleq">${q[0]}</div><div class="sample"><button onclick="toggleSample()">Sample Answer</button><div id="sampleText" style="display:${sampleShown?'block':'none'}">${q[1]}</div></div></div></div><div class="dots">${qIndex+1} of 5</div><div class="actions"><button onclick="qIndex=(qIndex+4)%5;sampleShown=false;draw()">Previous</button><button class="next" onclick="qIndex=(qIndex+1)%5;sampleShown=false;draw()">Next question</button></div>`}
}
function checkCountry(){let p=countries[photoIndex];document.getElementById('countryAnswer').textContent=`Answer: ${p[1]}. ${p[0]} is from ${p[1]}.`;document.getElementById('nextCountry').disabled=false}
function nextCountry(){photoIndex=(photoIndex+1)%countries.length;draw()}
function newDeck(){deck=[];flagNames.forEach(country=>{deck.push({country,open:false,matched:false},{country,open:false,matched:false})});for(let i=deck.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}first=null;lock=false;matches=0;turns=0;draw()}
function flip(i){if(lock||deck[i].open||deck[i].matched)return;deck[i].open=true;draw();if(first===null){first=i;return}turns++;let second=i;if(deck[first].country===deck[second].country){deck[first].matched=true;deck[second].matched=true;matches++;first=null;draw();document.getElementById('memoryFeedback').textContent=`Match! ${deck[second].country}. Say the country name aloud!`}else{lock=true;let a=first;first=null;setTimeout(()=>{deck[a].open=false;deck[second].open=false;lock=false;draw()},850)}}
function chooseChallenge(i){let c=challenge[challengeIndex];document.querySelectorAll('.answerChoice').forEach((b,j)=>{b.classList.remove('correct','wrong');if(j===i)b.classList.add(i===0?'correct':'wrong')});document.getElementById('challengeFeedback').textContent=i===0?'Great answer! Say the sentence aloud.':'Try again. Which answer is friendly and fits the situation?'}
function toggleSample(){sampleShown=!sampleShown;let el=document.getElementById('sampleText');el.style.display=sampleShown?'block':'none'}
newDeck();draw();
</script></body></html>
