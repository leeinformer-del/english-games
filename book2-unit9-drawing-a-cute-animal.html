<!DOCTYPE html>

<title>Cute Animal Artist – Drawing a Cute Animal</title>
<style>
:root{--ink:#2b2a3a;--a:#6b4a8f;--b:#f08a00;--sun:#ffd84a;--bg1:#fff3e0;--bg2:#f6d6a8;--red:#ff5c5c;--ok:#2fb86a;box-sizing:border-box}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Baloo 2","Comic Sans MS","Chalkboard SE",system-ui,sans-serif;background:linear-gradient(var(--bg1),var(--bg2));color:var(--ink);display:flex;flex-direction:column;overflow:hidden}
header{display:flex;align-items:center;gap:8px;padding:6px 14px;flex-wrap:wrap}
.tab{padding:5px 14px;border-radius:99px;background:#fff9;font-weight:700;font-size:15px;cursor:pointer}
.tab.on{background:var(--a);color:#fff}
#h{flex:1;font-size:clamp(17px,2.6vw,26px);font-weight:800;min-width:150px}
#t{font-size:28px;font-weight:800;background:#fff;border-radius:14px;padding:0 12px;min-width:86px;text-align:center}
#t.low{background:var(--red);color:#fff}
button{font:inherit;font-weight:800;border:0;border-radius:14px;padding:8px 16px;background:var(--sun);color:var(--ink);cursor:pointer}
button.sm{background:#fff;padding:6px 12px;font-size:15px;opacity:.85}
button.go{background:var(--a);color:#fff;font-size:20px;padding:10px 24px}
button:disabled{opacity:.4;cursor:default}
main{flex:1;min-height:0;display:flex;gap:14px;align-items:center;justify-content:center;padding:4px 14px 8px}
.panel{background:#fff;border-radius:22px;padding:12px 16px;box-shadow:0 6px 0 #0002;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.say{font-size:clamp(18px,2.8vh,26px);font-weight:800;min-height:30px}
.ans{color:#c0392b}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.row button{background:#ffe9a8;font-size:15px}
.pl{background:repeating-linear-gradient(45deg,#e9e4f5,#e9e4f5 10px,#f4f1fb 10px,#f4f1fb 20px);border:3px dashed #b9b0d8;border-radius:16px;display:grid;place-items:center;color:#7a6fa8;font-weight:800;text-align:center;padding:4px;aspect-ratio:1;min-width:0}
.pl span{font-size:clamp(11px,2vh,18px);line-height:1.1}
img.ph,.pl{width:100%;aspect-ratio:1}
img.ph{object-fit:cover;border-radius:16px;display:block}
#tip{padding:6px 16px;background:#fff9;font-size:14px;max-height:36vh;overflow:auto;display:none}
#tip ol{margin:4px 0 6px;padding-left:22px}#tip li{margin:2px 0}
#ro{position:fixed;inset:0;background:#000a;display:none;align-items:center;justify-content:center;z-index:9}
#ro>div{background:#fff;border-radius:24px;padding:26px 36px;text-align:center;font-size:clamp(24px,5vw,40px);font-weight:800;max-width:90vw}
#ro small{display:block;font-size:18px;font-weight:700;margin:8px 0 14px;color:#666}
.star{display:inline-block;width:1em;height:1em;background:var(--sun);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);vertical-align:-.1em}
.qb{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(560px,100%)}
.qc{position:relative;aspect-ratio:1.25;border-radius:16px;border:5px solid var(--a);background:var(--bg2);color:var(--a);font-size:clamp(34px,7vh,60px);font-weight:800;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer;padding:6px}
.qc u{position:absolute;top:3px;left:8px;font-size:13px;text-decoration:none;background:#fffc;border-radius:6px;padding:0 5px;color:var(--ink)}
.qc.dn{background:#e8f5e9;border-color:#9bd3ae;color:var(--ink);opacity:.65;font-size:clamp(13px,2.2vh,20px);line-height:1.2}
.qc.dn.on{background:#fff2a8;border-color:var(--red);opacity:1}
.qbig{font-size:clamp(26px,5vh,42px);font-weight:800;line-height:1.2}
@keyframes pop{0%{transform:scale(.3)}70%{transform:scale(1.15)}100%{transform:none}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pop{animation:pop .45s}
.row button.go{background:var(--a);color:#fff}.shake{animation:shake .35s}
#t,#tb{display:none!important}
.pip{display:inline-block;width:11px;height:11px;border-radius:50%;border:2px solid var(--a);margin-right:4px;vertical-align:-1px}.pip.on{background:var(--b);border-color:var(--b)}
/* M1 */
.hg{position:relative;display:flex;flex-wrap:wrap;justify-content:center;width:calc(min(17vh,142px)*4 + 62px);gap:10px;padding:10px;border-radius:20px;background:#fff8}
.tl{position:relative;width:min(17vh,142px);aspect-ratio:1;border-radius:14px;overflow:hidden;cursor:pointer;border:4px solid #fff;background:#fff}
.tl .pp{position:absolute;top:5px;left:5px;display:flex;gap:4px;z-index:5;pointer-events:none}
.tl .pp u{width:10px;height:10px;border-radius:50%;background:#fffd;border:2px solid var(--a)}.tl .pp u.on{background:var(--b);border-color:#fff}
.tl .paper{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(34px,7vh,58px);font-weight:800;color:#b8a98f;background:repeating-linear-gradient(-35deg,#fffdf6 0 7px,#f1ead7 7px 8px)}
.tl .ph,.tl .pl{position:absolute;inset:0;width:100%;height:100%;border-radius:0;clip-path:circle(0% at var(--cx) var(--cy));transition:clip-path .8s ease}
.tl.s1 .ph,.tl.s1 .pl{clip-path:circle(26% at var(--cx) var(--cy))}
.tl.s2 .ph,.tl.s2 .pl{clip-path:circle(52% at var(--cx) var(--cy))}
.tl.s3 .ph,.tl.s3 .pl{clip-path:circle(95% at var(--cx) var(--cy))}
.tl.s1 .paper::after,.tl.s2 .paper::after,.tl.s3 .paper::after{content:""}
.tl.s1 .paper,.tl.s2 .paper,.tl.s3 .paper{color:transparent}
.tl.on{outline:5px solid var(--b)}
.tl.shk{animation:dshk .3s}
@keyframes dshk{25%{transform:translate(-4px,2px) rotate(-2deg)}75%{transform:translate(4px,-1px) rotate(2deg)}}
.tl .lb{position:absolute;left:0;right:0;bottom:0;z-index:7;background:#2b2a3acc;color:#fff;font-weight:800;text-align:center;font-size:clamp(18px,3.4vh,28px);padding:4px 2px;display:none}
.tl.sw .lb{display:block}
/* M2/M3 bear */
.m2w{display:flex;gap:22px;align-items:center;justify-content:center}
.kid{display:flex;flex-direction:column;align-items:center;gap:6px;width:clamp(100px,18vh,150px)}
.av{width:clamp(80px,15vh,120px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:clamp(34px,7vh,58px)}
.nmt{font-size:clamp(22px,4vh,34px);font-weight:800}
.kid.hmm .av{animation:hm .35s infinite}
@keyframes hm{50%{transform:translateY(-8px) rotate(-6deg)}}
.bw{height:min(47vh,310px);aspect-ratio:300/320;flex:none}
.bw svg{width:100%;height:100%;overflow:visible}
.bp.hide{display:none}
.bp.dw *{stroke-dasharray:1;stroke-dashoffset:1;fill-opacity:0;animation:sdr 1s ease forwards,sfl .5s ease .85s forwards}
@keyframes sdr{to{stroke-dashoffset:0}}
@keyframes sfl{to{fill-opacity:1}}
.guide *{fill:none;stroke:#cbb99d;stroke-width:3;stroke-dasharray:6 6}
.chips{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;min-height:44px}
.chip{background:#fff;border:3px solid var(--a);color:var(--a);font-weight:800;border-radius:99px;padding:6px 16px;font-size:clamp(15px,2.6vh,22px);cursor:pointer}
.chip.on{background:var(--b);border-color:var(--b);color:#fff}
.stp{width:min(400px,100%)}

.ok7{background:#2eae60!important;color:#fff!important}
.tl .bg7{position:absolute;top:5px;right:5px;z-index:6;background:#fffe;border-radius:99px;padding:2px 6px;display:flex;gap:2px;font-size:14px;animation:pop .45s}
.tl.scd{border-color:#ffd84a}

.lft{display:flex;flex-direction:column;align-items:center;gap:6px}
.ttl9{font-size:clamp(20px,3.6vh,30px);font-weight:800;color:var(--a)}
.pgs{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;max-width:min(300px,40vw)}
.pg9{font-size:clamp(12px,2vh,16px);font-weight:800;padding:2px 10px;border-radius:99px;background:#fff9;color:#8a7a9a}
.pg9.on{background:var(--b);color:#fff}.pg9.dn{background:#d9f7e3;color:#1f8a4c}
.bn9{background:var(--a);color:#fff;border-radius:12px;padding:4px 12px;font-weight:800;font-size:clamp(14px,2.4vh,19px);text-align:center}
.pk9{font-size:clamp(14px,2.3vh,18px);font-weight:700;color:#6b5a7a;text-align:center}
.ab9{font-size:clamp(15px,2.6vh,21px)!important;font-weight:700;color:var(--a);border-top:3px dashed #d9c6ee;padding-top:6px}
.sm9{margin:4px 0;padding-left:22px;font-size:clamp(17px,3vh,24px);font-weight:700;line-height:1.5}
.sm9{list-style:none;padding:0;text-align:center}

.dd path{stroke-dasharray:1;stroke-dashoffset:1;animation:sdr 1.2s ease forwards}
.dd.st path{animation:none;stroke-dashoffset:0}
.wl9{display:flex;gap:8px;justify-content:center;margin-bottom:10px}
.fr9{width:clamp(48px,9vh,70px);aspect-ratio:1;background:#fff8;border:3px dashed #c9b6a0;border-radius:8px;padding:3px}
.fr9.on{background:#fff;border:3px solid var(--a)}
.fr9 svg{width:100%;height:100%}
.pp9{width:min(26vh,210px);aspect-ratio:1;background:#fff;border:4px solid #ecdcc3;border-radius:10px;padding:8px;box-shadow:inset 0 0 0 4px #fffdf6,0 4px 10px #0002;flex:none}
.pp9 svg{width:100%;height:100%}
.m3c{display:flex;flex-direction:column;align-items:center}.row2{display:flex;gap:20px;align-items:center;justify-content:center}

.arw{position:absolute;inset:0;width:100%;height:100%;z-index:6;display:none;pointer-events:none;filter:drop-shadow(0 1px 2px #0006)}
.tl.sw .arw{display:block}
.hg.lg{width:calc(min(20vh,160px)*4 + 62px)}.hg.lg .tl{width:min(20vh,160px)}
.tl .lb{font-size:clamp(15px,2.7vh,22px)!important;padding:2px!important}
.tl.ar .arw{display:block}

.cw9{display:flex;flex-direction:column;align-items:center;gap:6px;flex:none}
#cv9{width:min(33vh,270px);aspect-ratio:1;background:#fff;border:4px solid #ecdcc3;border-radius:10px;box-shadow:0 4px 10px #0002;cursor:crosshair;touch-action:none}
.cols9{display:flex;gap:7px;align-items:center}
.cd9{width:26px;height:26px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #0003;padding:0;cursor:pointer}.cd9.on{box-shadow:0 0 0 3px var(--b)}
.clr9{padding:3px 12px!important;font-size:14px!important;border-radius:99px!important}
.qa9{max-width:320px;min-height:200px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.wt9{font-size:clamp(18px,3vh,24px);font-weight:700;color:#a89a8a}
.qb9{opacity:0;transform:translateY(10px);transition:all .6s}.qb9.show{opacity:1;transform:none}
.fr9 img{width:100%;height:100%;object-fit:cover;border-radius:4px;display:block}
.fr9.nw{transform-origin:50% 0;animation:hang9 1s ease-out}
@keyframes hang9{0%{transform:translateY(-60px) rotate(0);opacity:0}50%{transform:translateY(4px) rotate(8deg);opacity:1}75%{transform:rotate(-5deg)}100%{transform:none}}
.qa9{width:300px}
.wt9 b{color:var(--a)}

#cv9{width:min(41vh,330px)!important}
.cd9{width:36px!important;height:36px!important}
.tls9{display:flex;flex-direction:column;gap:8px;align-items:center}
.tb9{min-width:42px;height:38px;border-radius:12px;border:3px solid var(--a);background:#fff;color:var(--a);font-weight:800;font-size:18px;padding:0 8px;cursor:pointer}
.tb9.on{background:var(--b);border-color:var(--b);color:#fff}
.clr9{padding:5px 16px!important;font-size:16px!important}
.qa9{width:320px!important;min-height:0!important}
.tp9{font-size:clamp(14px,2.3vh,18px);font-weight:700;color:#2e9e5b;margin-top:6px}

.smp9{display:flex;flex-direction:column;gap:8px;align-items:center;flex:none}
.sl9{font-weight:800;color:var(--a);font-size:clamp(14px,2.4vh,18px)}
.sp9{width:min(18vh,140px);aspect-ratio:1;background:#fff;border:3px dashed #cdb8e6;border-radius:12px;padding:4px}
.sp9 svg{width:100%;height:100%}

function ph(k,c){return IMG[k]?'<img class="ph '+(c||'')+'" src="'+IMG[k]+'" alt="">':'<div class="pl '+(c||'')+'"><span>'+(LBL[k]||k)+'</span></div>'}
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const DUR=[180, 180, 360];
let cur=0,secs=0,iv=null;
function fmt(){$('#t').textContent=Math.floor(secs/60)+':'+String(secs%60).padStart(2,'0');$('#t').classList.toggle('low',secs<=30)}
function tog(){if(iv){clearInterval(iv);iv=null;$('#tb').textContent='Start'}else{iv=setInterval(()=>{secs>0?(secs--,fmt()):tog()},1000);$('#tb').textContent='Pause'}}

function say(h){$('#sy').innerHTML=h}
function fin(){celebrate('Drawing a Cute Animal!','They draw a big bear together!')}
function celebrate(m,s){$('#rm').innerHTML=m;$('#rs').textContent=s||'';$('#ro').style.display='flex'}
function qcards(el,QS){
  const cells=QS.map(x=>({...x}));let last=-1;
  el.innerHTML='<div class="qb" id="qb"></div><div class="panel" id="qp" style="width:min(440px,100%);min-height:260px"><div class="qbig" id="qq">Tap a card!</div><div class="say" id="sy"></div><div class="row" id="qr"></div></div>';
  cells.forEach((c,i)=>{const d=document.createElement('div');d.className='qc';d.id='q'+i;d.innerHTML='<u>'+(i+1)+'</u>?';d.onclick=()=>{
    if(c.dn)return;c.dn=1;document.querySelectorAll('.qc').forEach(e=>e.classList.remove('on'));
    d.className='qc dn on pop';d.innerHTML='<u>'+(i+1)+'</u>'+c.q;
    $('#qq').textContent=c.q;say('');
    $('#qr').innerHTML='<button onclick="say(\'<span class=ans>'+c.h.replace(/'/g,"\\'")+'</span>\')">Hint</button><button onclick="say(\'<span class=ans>'+c.f.replace(/'/g,"\\'")+'</span>\')">Follow-up question</button>';
    if(cells.every(x=>x.dn))setTimeout(()=>celebrate('All cards open!','Great talking!'),700)};
    $('#qb').appendChild(d)});
}
const A=[];
function go(i){if(iv)tog();cur=i;secs=DUR[i];fmt();

  $('#nx').style.display=i==A.length-1?'none':'';$('#fn').style.display=i==A.length-1?'':'none';
